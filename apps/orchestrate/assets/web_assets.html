      window.uiRegisterClientAction('orchestrate_rules_modal', function() {
        var id = getAgentID();
        if (!id) { window.uiAlert('Pick an agent first.'); return; }
        fetchAgent(id).then(function(agent) {
          var m = openOrchModal('Rules — ' + (agent.name || id));
          var help = document.createElement('div');
          help.className = 'ui-orch-modal-help';
          help.textContent = 'Guidance the agent follows — prepended to BOTH the orchestrator and worker every turn. Use for soft constraints like "always cite a URL" or "prefer concise replies". The agent (and Builder) can edit these; for hard limits an independent check enforces, use Enforced guardrails below.';
          m.body.appendChild(help);
          var rulesTitle = document.createElement('div');
          rulesTitle.style.cssText = 'font-weight:600;color:var(--text);margin-bottom:0.3rem';
          rulesTitle.textContent = 'Rules';
          m.body.appendChild(rulesTitle);
          var list = document.createElement('div');
          list.className = 'ui-orch-list';
          m.body.appendChild(list);

          var rules = (agent.rules || '').split('\n')
            .map(function(s) { return s.replace(/^\s*([-*]|\d+\.)\s*/, '').trim(); })
            .filter(function(s) { return s.length > 0; });
          // If empty, start with one blank row so the user has something to type into.
          if (rules.length === 0) rules.push('');

          function render() {
            list.innerHTML = '';
            rules.forEach(function(text, idx) {
              var row = document.createElement('div');
              row.className = 'ui-orch-list-row';
              var input = document.createElement('input');
              input.type = 'text';
              input.value = text;
              input.placeholder = 'rule…';
              input.addEventListener('input', function() { rules[idx] = input.value; });
              // Elevate: promote this soft rule into the protected, enforced
              // guardrails band below. It MOVES (a rule and its guardrail would
              // otherwise drift as two editable copies); the warden then hard-
              // checks it, and the agent can no longer edit it away.
              var up = document.createElement('button');
              up.className = 'ui-orch-list-del';
              up.type = 'button';
              up.textContent = '⤓';
              up.title = 'Elevate to an enforced guardrail';
              up.onclick = function() {
                var t = (rules[idx] || '').trim();
                if (!t) { window.uiAlert('Type the rule first, then elevate it.'); return; }
                // Drop blank guardrail rows and de-dupe before adding. Compared on
                // the rule BODY, not the raw line: a guardrail already carrying the
                // terminal marker would not match the unmarked text being elevated,
                // and the same rule would land twice under two severities.
                grules = grules.filter(function(s) { return gBody(s).length > 0; });
                var already = grules.some(function(s) { return gBody(s) === gBody(t); });
                // Elevated rules keep their severity unset deliberately. A blank new
                // row is authored in the hard band and defaults to Terminal; this is
                // existing text the owner wrote as guidance, and whether it forbids or
                // merely shapes is not something to guess at. The row toggle is right
                // there.
                if (!already) grules.push(t);
                rules.splice(idx, 1);
                if (!rules.length) rules.push('');
                render();
                renderG();
                gWrap.scrollIntoView({behavior: 'smooth', block: 'nearest'});
              };
              var del = document.createElement('button');
              del.className = 'ui-orch-list-del';
              del.type = 'button';
              del.textContent = '×';
              del.onclick = function() {
                rules.splice(idx, 1);
                if (!rules.length) rules.push('');
                render();
              };
              row.appendChild(input);
              row.appendChild(up);
              row.appendChild(del);
              list.appendChild(row);
            });
            var addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'ui-orch-list-add';
            addBtn.textContent = '+ Add rule';
            addBtn.onclick = function() {
              rules.push('');
              render();
              var inputs = list.querySelectorAll('input');
              var last = inputs[inputs.length - 1];
              if (last) last.focus();
            };
            list.appendChild(addBtn);
          }
          render();

          // --- Enforced guardrails band ---
          // Hard limits checked by an INDEPENDENT warden (a separate model
          // call in fresh context), not merely prompted. Owner-only: saved
          // via the dedicated api/agents/<id>/guardrails endpoint, which is
          // the ONLY path allowed to change them — the whole-record save
          // above preserves them, and no agent tool can write them, so a
          // persuaded agent can't rewrite the rule it's about to be checked
          // against.
          var gWrap = document.createElement('div');
          gWrap.style.cssText = 'margin-top:1.2rem;padding-top:0.9rem;border-top:1px solid var(--border)';
          var gTitle = document.createElement('div');
          gTitle.style.cssText = 'font-weight:600;color:var(--text);margin-bottom:0.3rem';
          gTitle.textContent = 'Enforced guardrails';
          gWrap.appendChild(gTitle);
          var gHelp = document.createElement('div');
          gHelp.className = 'ui-orch-modal-help';
          gHelp.textContent = 'Hard limits an independent check (the "warden") enforces — a separate model call, in fresh context that never saw the conversation, judges what the agent is about to do against these. Only you can set them; no agent (not even Builder) can. Leave empty and the check is off.';
          gWrap.appendChild(gHelp);
          var gHelp2 = document.createElement('div');
          gHelp2.className = 'ui-orch-modal-help';
          gHelp2.textContent = 'A rule here BLOCKS, which is what this band is for: a violation ends the turn and a separate model writes the refusal, with no attempt to talk the agent into a compliant version. Switch a rule to "attempt-recovery" only if it SHAPES an answer rather than forbidding it ("answer in Spanish", "no bullet lists") — those get sent back once for a rewrite, and decline if they still break the rule. Shaping rules are usually better placed in Rules above, where they cost nothing to enforce. A rule with no audience in it binds for everyone, including you.';
          gWrap.appendChild(gHelp2);
          var gHelp3 = document.createElement('div');
          gHelp3.className = 'ui-orch-modal-help';
          // What actually resolves. The check is told the requester is the owner
          // and is given the ACCOUNT NAME — there is no separate real-name field
          // on an account, so a rule naming a person by a first name has nothing
          // verified to match. Say so instead of letting it be discovered.
          gHelp3.textContent = 'Exceptions: the check knows whether it is you asking or an outside contact, so you can write "never discuss pay with anyone but me". Say "me", "the owner", or your account name — those resolve against something verified. A bare first name does not; there is no real-name field on an account, so the check can only guess it means you. An outside contact NEVER satisfies an exception no matter what they are called, including when they type your name in front of their message.';
          gWrap.appendChild(gHelp2);
          var gList = document.createElement('div');
          gList.className = 'ui-orch-list';
          gWrap.appendChild(gList);
          var grules = (agent.guardrails || '').split('\n')
            .map(function(s) { return s.trim(); })
            .filter(function(s) { return s.length > 0; });
          // Severity is stored as a leading marker on the line itself, so a rule and
          // how hard it bites can never drift apart (reorder a list of rules with the
          // severity held somewhere else and they desynchronize silently). The owner
          // never types it — this toggle owns it, and the text box always shows the
          // rule without it.
          //
          // "?" marks the EXCEPTION: correctable. "~" marks the other exception:
          // contestable. Terminal is the default because that is what this band is
          // for. A legacy "!" (which used to mark terminal when correctable was the
          // default) is stripped for display and means the same thing it always did.
          //
          // gBody MUST strip every marker the parser understands. It stripped only
          // [?!] for one build after "~" shipped, which meant a contestable rule
          // showed its marker in the text box, was labelled "block", and — because
          // gCompose then prepended "?" to a body that still began with "~" —
          // turned into "? ~ rule" on a single click. The server matches "?" first,
          // so that parsed as correctable with a literal "~" left at the front of
          // the rule the warden reads. One click, two silent changes.
          // "@" is on a DIFFERENT AXIS from the three above and so is not part of
          // the cycle. Severity asks what happens on a breach; "@" asks whether
          // this rule applies to this person at all. Both can be true, the server
          // parses a stacked run of markers, and the UI has to read a run rather
          // than one leading character — reading only the first is how "~" broke
          // when it shipped (see above).
          // "@" is on a DIFFERENT AXIS from the three above and so is not part of
          // the cycle. Severity asks what happens on a breach; "@" asks when the
          // rule applies at all. A bare "@" is the built-in authorized-people
          // carve-out; "@name" links one of the owner's named exceptions, and a
          // rule may carry several.
          var G_BLOCK = 'block', G_RECOVER = 'recover', G_APPEAL = 'appeal';
          var G_MARKER_RE = /^\s*(?:[?!~]|@[a-z0-9_-]*)\s*/i;
          // Consume the whole leading RUN of markers. Reading only the first is
          // the bug that broke "~" when it shipped, and with "@name" links a
          // rule routinely carries three or four.
          function gMarkers(s) {
            var rest = String(s || ''), taken = '';
            for (;;) {
              var m = rest.match(G_MARKER_RE);
              if (!m) { return taken; }
              taken += m[0]; rest = rest.slice(m[0].length);
            }
          }
          function gMode(s) {
            var m = gMarkers(s);
            if (m.indexOf('?') >= 0) { return G_RECOVER; }
            if (m.indexOf('~') >= 0) { return G_APPEAL; }
            return G_BLOCK;
          }
          // Bare "@" only — "@night-shift" is a link, not the built-in.
          function gExempt(s) { return /(^|[^a-z0-9_-])@(?![a-z0-9_-])/i.test(gMarkers(s)); }
          // Each link is {name, off}. "@-name" is switched off for THIS rule
          // only; the link stays visible so a carve-out that is not applying is
          // something you can see rather than something to remember.
          function gLinks(s) {
            var out = [], re = /@(-?)([a-z0-9_-]+)/gi, m, seen = {};
            while ((m = re.exec(gMarkers(s)))) {
              if (seen[m[2]]) { continue; }
              seen[m[2]] = true;
              out.push({name: m[2], off: m[1] === '-'});
            }
            return out;
          }
          function gBody(s) { return String(s || '').slice(gMarkers(s).length); }
          function gCompose(body, mode, exempt, links) {
            var pre = exempt ? '@' : '';
            (links || []).forEach(function(l) { pre += '@' + (l.off ? '-' : '') + l.name; });
            if (mode === G_RECOVER) { pre += '?'; }
            else if (mode === G_APPEAL) { pre += '~'; }
            return pre ? pre + ' ' + body : body;
          }
          function gSlug(s) {
            return String(s || '').toLowerCase().replace(/[^a-z0-9_]+/g, '-').replace(/^-+|-+$/g, '');
          }
          // Declared up here, not beside its editor below, because renderG()
          // reads it while drawing each rule's link button.
          var gexceptions = (agent.guardrail_exceptions || []).slice();
          // Legacy roster entries surface as person items, matching what the
          // server does on read — so an owner who typed a roster before items
          // existed sees it in the one list rather than losing track of it.
          (function () {
            var have = {};
            gexceptions.forEach(function(e) {
              if ((e.kind || 'condition') === 'person') { have[String(e.text || '').trim().toLowerCase()] = true; }
            });
            (agent.authorized_identities || []).forEach(function(id) {
              var v = String(id || '').trim();
              if (!v || have[v.toLowerCase()]) { return; }
              have[v.toLowerCase()] = true;
              gexceptions.push({name: gSlug(v) || 'person', text: v, kind: 'person'});
            });
          })();
          // The link handle for one exception, matching what the SERVER will
          // store: its name slugged, or derived from the condition's opening
          // words when the name is still blank. Never falls back to '' — an
          // empty handle composes to a bare "@", which is the built-in
          // authorized-people carve-out, so linking an unnamed condition would
          // silently grant a completely different exemption.
          function gExcSlug(ex) {
            if (!ex) { return ''; }
            var s = gSlug(ex.name);
            if (s) { return s; }
            var words = String(ex.text || '').split(/\s+/).filter(Boolean).slice(0, 4);
            return gSlug(words.join(' '));
          }
          function gLinkExists(name) {
            for (var i = 0; i < gexceptions.length; i++) {
              if (gExcSlug(gexceptions[i]) === name) { return true; }
            }
            return false;
          }
          function gLinkSummary(text) {
            var names = gLinks(text).map(function(l) {
              var label = l.name + ' (deleted)';
              for (var i = 0; i < gexceptions.length; i++) {
                if (gExcSlug(gexceptions[i]) === l.name) { label = gexceptions[i].name || l.name; break; }
              }
              return label + (l.off ? ' — off here' : '');
            });
            if (gExempt(text)) { names.unshift('authorized people'); }
            return names.join(', ');
          }
          // The picker. Built-in first (gohort settles it itself), then the
          // owner's own conditions, which the warden reads under the rule.
          function openExceptionPicker(idx) {
            var chosen = gLinks(grules[idx]).slice();   // [{name, off}]
            var builtin = gExempt(grules[idx]);
            function findLink(name) {
              for (var i = 0; i < chosen.length; i++) { if (chosen[i].name === name) { return i; } }
              return -1;
            }
            // Write the rule line back on every change, so the count behind the
            // modal tracks what you are doing. Previously each click closed and
            // reopened the whole dialog to refresh, which looked like a glitch
            // and lost your place in the list.
            function commit() {
              grules[idx] = gCompose(gBody(grules[idx]), gMode(grules[idx]), builtin, chosen);
              renderG();
            }
            window.uiOpenModal({
              title: 'Exceptions for this rule',
              subtitle: 'Tick what this rule does NOT apply to. Each one can be switched off for this rule alone — the link is kept and the other rules using it are untouched.',
              width: '600px',
              mount: function(body, api) {
                var rows = document.createElement('div');
                body.appendChild(rows);

                function drawRow(opts) {
                  var wrap = document.createElement('div');
                  wrap.style.cssText = 'display:flex;gap:0.55rem;align-items:flex-start;padding:0.45rem 0;border-bottom:1px solid var(--border)';
                  var cb = document.createElement('input');
                  cb.type = 'checkbox'; cb.checked = !!opts.linked;
                  cb.style.cssText = 'margin-top:0.25rem;flex:0 0 auto;cursor:pointer';
                  cb.onchange = function() { opts.onLink(cb.checked); };
                  var txt = document.createElement('div');
                  txt.style.cssText = 'flex:1 1 auto;min-width:0';
                  if (opts.linked && opts.off) { txt.style.opacity = '0.55'; }
                  var head = document.createElement('div');
                  head.style.cssText = 'font-size:0.85rem;display:flex;gap:0.4rem;align-items:baseline;flex-wrap:wrap';
                  var name = document.createElement('span');
                  name.textContent = opts.label;
                  head.appendChild(name);
                  if (opts.badge) {
                    var b = document.createElement('span');
                    b.textContent = opts.badge;
                    b.style.cssText = 'font-size:0.66rem;letter-spacing:0.03em;color:var(--text-mute);border:1px solid var(--border);border-radius:3px;padding:0 0.25rem';
                    head.appendChild(b);
                  }
                  txt.appendChild(head);
                  if (opts.hint) {
                    var sub = document.createElement('div');
                    sub.textContent = opts.hint;
                    sub.style.cssText = 'font-size:0.75rem;color:var(--text-mute);line-height:1.4;margin-top:0.1rem;overflow-wrap:anywhere';
                    txt.appendChild(sub);
                  }
                  wrap.appendChild(cb); wrap.appendChild(txt);
                  if (opts.onToggle) {
                    var pill = document.createElement('button');
                    pill.type = 'button'; pill.className = 'ui-orch-list-del';
                    pill.textContent = (opts.linked && opts.off) ? 'off' : 'on';
                    pill.style.cssText = 'width:auto;padding:0 0.5rem;font-size:0.7rem;align-self:center;' +
                      ((opts.linked && opts.off)
                        ? 'color:var(--text-mute);opacity:0.7'
                        : 'color:var(--accent,#6366f1);border-color:var(--accent,#6366f1);font-weight:600');
                    // Always clickable. Requiring the tick first meant "switch
                    // this off for this rule" — the commonest thing you want —
                    // took two clicks on two different controls, and looked
                    // broken until you found the first one.
                    pill.title = (opts.linked && opts.off)
                      ? 'Switched off for THIS rule. Click to apply it here again.'
                      : (opts.linked
                        ? 'Applying to this rule. Click to switch it off here only — the link is kept.'
                        : 'Not on this rule. Click to attach it switched OFF, so it is visible here without applying.');
                    pill.onclick = function() { opts.onToggle(); };
                    wrap.appendChild(pill);
                  }
                  rows.appendChild(wrap);
                }

                function redraw() {
                  rows.innerHTML = '';
                  if (builtin) {
                    drawRow({
                      label: 'Anyone on the authorized list',
                      hint: 'The older whole-list carve-out. Untick it and link people individually for finer control.',
                      badge: 'checked by gohort', linked: true, off: false,
                      onLink: function(on) { builtin = on; commit(); redraw(); },
                    });
                  }
                  if (!gexceptions.length) {
                    var none = document.createElement('div');
                    none.style.cssText = 'font-size:0.78rem;color:var(--text-mute);line-height:1.45;padding-top:0.5rem';
                    none.textContent = 'Nothing to link yet. Add people and conditions under “Exceptions” at the bottom of this panel, then come back.';
                    rows.appendChild(none);
                  }
                  // Links whose carve-out is GONE. Listed first, because they
                  // are the only rows here that are a problem rather than a
                  // choice — and without a row there is no way to remove one:
                  // the item it names is not in the list to untick.
                  chosen.forEach(function(l) {
                    if (gLinkExists(l.name)) { return; }
                    drawRow({
                      label: l.name,
                      hint: 'This no longer exists, so it applies to nothing and the rule is at full strength. Untick to clear it off the rule.',
                      badge: 'missing', linked: true, off: false,
                      onLink: function() {
                        var i = findLink(l.name);
                        if (i >= 0) { chosen.splice(i, 1); }
                        commit(); redraw();
                      },
                    });
                  });
                  gexceptions.forEach(function(ex) {
                    var slug = gExcSlug(ex);
                    if (!slug) {

              // Name the condition for them if they didn't. The server derives
              // one anyway, and deriving it silently would leave the field
              // looking empty while a different name was what actually linked.
              textIn.onblur = function() {
                if (gSlug(gexceptions[idx].name)) { return; }
                var words = String(gexceptions[idx].text || '').split(/\s+/).filter(Boolean).slice(0, 4);
                var derived = gSlug(words.join(' '));
                if (!derived) { return; }
                gexceptions[idx].name = derived;
                nameIn.value = derived;
                renderG();
              };
              var del = document.createElement('button');
              del.type = 'button'; del.className = 'ui-orch-list-del'; del.textContent = '×';
              // Deleting an exception TIGHTENS every rule that linked it: the
              // dangling name resolves to nothing and the rule goes back to
              // full strength. Say so, because the opposite would be a quiet
              // hole in a rule the owner still believes is absolute.
              del.title = 'Delete. Rules linked to it go back to applying in full. To turn it off temporarily, use the on/off button instead — that keeps the wording and the links.';
              del.onclick = function() { gexceptions.splice(idx, 1); renderE(); renderG(); };
              row.appendChild(kindBtn); row.appendChild(nameIn); row.appendChild(textIn); row.appendChild(del);
              excList.appendChild(row);
            });
            var addE = document.createElement('button');
            addE.type = 'button'; addE.className = 'ui-orch-list-add'; addE.textContent = '+ Add exception';
            addE.onclick = function() { gexceptions.push({name: '', text: ''}); renderE(); };
            excList.appendChild(addE);
          }
          renderE();
          var excHelp = document.createElement('div');
          excHelp.style.cssText = 'font-size:0.75rem;color:var(--text-mute);margin-top:0.3rem;line-height:1.4';
          excHelp.textContent = 'The warden reads a linked condition on an “Except:” line under the rule, and treats the rule as satisfied when it plainly holds. Write it as a condition about the request, not as an instruction. These are judged by a model, so keep them off rules protecting anything you cannot undo.';
          excWrap.appendChild(excHelp);
          gWrap.appendChild(excWrap);

          // Declines: the lines the USER sees when a reply can't be made to
          // satisfy the rules. A SET, not one line — an identical refusal
          // every time is a fingerprint that tells a prober exactly which
          // attempts tripped the guardrail.
          //
          // The model may WRITE these, here at authoring time, in a clean
          // context with no protected content in scope and the owner
          // reviewing before they go live. Nothing is generated at block
          // time, where the model still holds the withheld content.
          var declines = (agent.guardrail_declines || []).slice();
          var decWrap = document.createElement('div');
          decWrap.style.cssText = 'margin-top:0.7rem';
          var decLbl = document.createElement('div');
          decLbl.style.cssText = 'font-size:0.8rem;color:var(--text-mute);margin-bottom:0.25rem';
          decLbl.textContent = 'Decline examples — voice + fallback (optional):';
          decWrap.appendChild(decLbl);
          var decList = document.createElement('div');
          decList.className = 'ui-orch-list';
          decWrap.appendChild(decList);
          function renderD() {
            decList.innerHTML = '';
            declines.forEach(function(text, idx) {
              var row = document.createElement('div');
              row.className = 'ui-orch-list-row';
              var input = document.createElement('input');
              input.type = 'text'; input.value = text; input.placeholder = 'decline line\u2026';
              input.className = 'ui-orch-list-input';
              input.oninput = function() { declines[idx] = input.value; };
              var del = document.createElement('button');
              del.type = 'button'; del.className = 'ui-orch-list-del'; del.textContent = '\u00d7';
              del.onclick = function() { declines.splice(idx, 1); renderD(); };
              row.appendChild(input); row.appendChild(del);
              decList.appendChild(row);
            });
            var btnRow = document.createElement('div');
            btnRow.style.cssText = 'display:flex;gap:0.4rem;flex-wrap:wrap';
            var addD = document.createElement('button');
            addD.type = 'button'; addD.className = 'ui-orch-list-add'; addD.textContent = '+ Add decline';
            addD.onclick = function() { declines.push(''); renderD(); };
            btnRow.appendChild(addD);
            var genLabel = '\u2728 Write in this agent\u2019s voice';
            var genD = document.createElement('button');
            genD.type = 'button'; genD.className = 'ui-orch-list-add';
            genD.textContent = genLabel;
            genD.title = 'Draft a set now, in the agent\u2019s voice. Written here, not when a block happens, and reviewed by you before it is ever shown.';
            genD.onclick = function() {
              genD.disabled = true; genD.textContent = 'Writing\u2026';
              fetch('api/agents/' + encodeURIComponent(id) + '/decline-suggest', {method: 'POST'})
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(d) {
                  var got = (d && d.declines) || [];
                  if (!got.length) { window.uiAlert('No usable lines came back \u2014 the ones written gave the reason away and were dropped. Try again, or write your own.'); return; }
                  declines = got; renderD();
                })
                .catch(function(err) { window.uiAlert('Could not write declines: ' + (err && err.message || err)); })
                .then(function() { genD.disabled = false; genD.textContent = genLabel; });
            };
            btnRow.appendChild(genD);
            decList.appendChild(btnRow);
          }
          renderD();
          var decHelp = document.createElement('div');
          decHelp.className = 'ui-orch-modal-help';
          decHelp.style.cssText = 'margin-top:0.15rem';
          decHelp.textContent = 'When a rule stops a turn, the refusal is written fresh by a separate model that never saw the conversation \u2014 so it can speak to what was asked instead of sounding canned. These lines are no longer that reply. They do two things: they show that model the voice to match, and they are the fallback if it can\u2019t be reached. Leave empty for neutral built-ins. Keep them uninformative either way: a line that names the rule, or hints that rewording would land, hands a prober the signal the guardrail exists to withhold. Lines that give the reason away are dropped on save.';
          decWrap.appendChild(decHelp);
          gWrap.appendChild(decWrap);

          // Test box — run the warden against a sample candidate now, without
          // any live interception, so the owner can feel the check.
          var testWrap = document.createElement('div');
          testWrap.style.cssText = 'margin-top:0.7rem;padding-top:0.6rem;border-top:1px dashed var(--border)';
          var testLbl = document.createElement('div');
          testLbl.style.cssText = 'font-size:0.8rem;color:var(--text-mute);margin-bottom:0.25rem';
          testLbl.textContent = 'Test: paste an action/output and see the warden judge it against the guardrails above.';
          testWrap.appendChild(testLbl);
          var testIn = document.createElement('textarea');
          testIn.rows = 2;
          testIn.placeholder = "e.g. Post: 'Jane Doe lives at 12 Elm St.'";
          testIn.style.cssText = 'width:100%;box-sizing:border-box;background:var(--bg-0);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.35rem 0.5rem;font:inherit';
          testWrap.appendChild(testIn);
          // Who is asking. An audience-scoped rule judges differently for you and
          // for a stranger, and the stranger is the half that matters and the half
          // that is easy to get wrong — so it has to be reachable from here.
          // Blank means you, the owner.
          // WHO is asking now decides which rules are even checked, because a
          // rule can be excepted for one person and not another. A free-text
          // name alone could only ever produce "a stranger" — the people on the
          // list were untestable, which is the half exceptions exist for.
          var testWho = document.createElement('select');
          testWho.style.cssText = 'width:100%;box-sizing:border-box;margin-top:0.3rem;background:var(--bg-0);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.3rem 0.5rem;font:inherit;font-size:0.82rem';
          function fillTestWho() {
            var keep = testWho.value;
            testWho.innerHTML = '';
            function opt(v, label) {
              var o = document.createElement('option');
              o.value = v; o.textContent = label;
              testWho.appendChild(o);
            }
            opt('', 'as you (the owner)');
            opt('__stranger__', 'as an outside contact');
            gexceptions.forEach(function(ex) {
              if (ex.kind !== 'person') { return; }
              var slug = gExcSlug(ex);
              if (slug) { opt(slug, 'as ' + (ex.name || slug) + ' — ' + (ex.text || '')); }
            });
            testWho.value = keep;
            if (!testWho.value) { testWho.selectedIndex = 0; }
          }
          fillTestWho();
          testWrap.appendChild(testWho);
          var testAs = document.createElement('input');
          testAs.type = 'text';
          testAs.placeholder = 'the outside contact’s self-reported name (optional)';
          testAs.style.cssText = 'width:100%;box-sizing:border-box;margin-top:0.3rem;background:var(--bg-0);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.3rem 0.5rem;font:inherit;font-size:0.82rem;display:none';
          testWho.onchange = function() {
            testAs.style.display = (testWho.value === '__stranger__') ? '' : 'none';
          };
          testWrap.appendChild(testAs);
          var testBtn = document.createElement('button');
          testBtn.type = 'button'; testBtn.className = 'ui-orch-list-add'; testBtn.textContent = 'Test guardrails';
          testBtn.style.marginTop = '0.35rem';
          var testOut = document.createElement('div');
          testOut.style.cssText = 'margin-top:0.4rem;font-size:0.82rem;white-space:pre-wrap';
          testBtn.onclick = function() {
            var cand = testIn.value.trim();
            if (!cand) { return; }
            testOut.textContent = 'Checking…'; testBtn.disabled = true;
            fetch('api/agents/' + encodeURIComponent(id) + '/guardrail-test', {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                candidate: cand, hook: 'pre_action',
                as: (testWho.value && testWho.value !== '__stranger__') ? testWho.value : '',
                sender: (testWho.value === '__stranger__') ? (testAs.value.trim() || 'an outside contact') : ''
              })
            }).then(function(r) { return r.ok ? r.json() : r.text().then(function(t){ throw new Error(t); }); })
              .then(function(d) {
                if (d.note) { testOut.textContent = d.note; return; }
                var colors = {violate: 'var(--danger,#ff7b72)', unsure: '#f59e0b', comply: '#10b981'};
                var askedBy = d.as_owner ? 'by you' : (d.as ? 'by ' + d.as : 'by an outside contact');
                var lines = ['Verdict: ' + (d.status || '?').toUpperCase() + '  (asked ' + askedBy + ')'];
                (d.verdicts || []).forEach(function(v) {
                  lines.push('• [' + v.status + '] ' + (v.rule || '') + (v.reason ? ' — ' + v.reason : ''));
                });
                // Rules this person is excepted from were never asked about.
                // Said out loud, because "no verdicts" otherwise reads as
                // "nothing objected" when the truth is "nothing was checked".
                var skipped = d.excepted || [];
                if (skipped.length) {
                  lines.push('');
                  lines.push('Not checked — excepted for this person (' + skipped.length + '):');
                  skipped.forEach(function(rule) { lines.push('· ' + rule); });
                }
                if (!skipped.length && !(d.verdicts || []).length && d.checked === 0) {
                  lines.push('');
                  lines.push('No rules were in play for this requester.');
                }
                testOut.textContent = lines.join('\n');
                testOut.style.color = colors[d.status] || 'var(--text)';
              })
              .catch(function(err) { testOut.textContent = 'Test failed: ' + (err && err.message || err); testOut.style.color = 'var(--danger,#ff7b72)'; })
              .then(function() { testBtn.disabled = false; });
          };
          testWrap.appendChild(testBtn);
          testWrap.appendChild(testOut);
          gWrap.appendChild(testWrap);
          m.body.appendChild(gWrap);

          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'ui-orch-modal-btn';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.onclick = m.close;
          var saveBtn = document.createElement('button');
          saveBtn.className = 'ui-orch-modal-btn primary';
          saveBtn.textContent = 'Save';
          saveBtn.onclick = function() {
            var clean = rules.map(function(r) { return r.trim(); })
                             .filter(function(r) { return r.length > 0; });
            agent.rules = clean.join('\n');
            var gclean = grules.map(function(r) { return r.trim(); })
                               .filter(function(r) { return r.length > 0; });
            var hooks = hookDefs.map(function(h){ return h.v; }).filter(function(v){ return activeHooks[v]; });
            saveBtn.disabled = true;
            // Two saves, STRICTLY SEQUENCED — never Promise.all.
            //
            // The whole-record POST preserves guardrails by copying them from
            // the STORED copy server-side. Run concurrently with the
            // guardrails POST, it reads that copy BEFORE the guardrails write
            // commits and then saves the stale value over it — a lost update
            // that silently discarded the rule the user just typed. Both
            // symptoms followed: the new guardrail never appeared, and the
            // warden had nothing to enforce.
            //
            // Record first, guardrails last, so the protected write is the one
            // that lands on top.
            fetch('api/agents', {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(agent),
            }).then(function(r) {
              if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
            }).then(function() {
              return fetch('api/agents/' + encodeURIComponent(id) + '/guardrails', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({guardrails: gclean.join('\n'), hooks: hooks, fail_closed: !!failCb.checked, declines: declines, disabled: !!guardrailsOff, exceptions: gexceptions}),
              });
            }).then(function(r) {
              if (!r.ok && r.status !== 204) return r.text().then(function(t){ throw new Error(t); });
              // The save answers with what it STORED. Compare against what we
              // sent and say so if anything didn't make it: a list that comes
              // back shorter than it went in is the failure mode that reads as
              // "it won't save", and it went unreported for days because the
              // modal trusted its own copy and closed.
              return r.json().then(function(d) { return d; }, function() { return null; });
            }).then(function(stored) {
              if (stored) {
                // Counts every row the owner TOUCHED, not just the well-formed
                // ones. Counting only rows with both halves filled would stay
                // silent about the exact case worth reporting: a row where they
                // typed one and not the other, which the server drops.
                var sent = gexceptions.filter(function(x){
                  return x && (String(x.name || '').trim() || String(x.text || '').trim());
                }).length;
                var lost = sent - (stored.exceptions || []).length;
                if (lost > 0) {
                  window.uiAlert('Saved, but ' + lost + ' exception' + (lost === 1 ? '' : 's') +
                    ' could not be stored (an entry needs both a name and a value; blanks and duplicates are dropped). Reopen Rules to see what was kept.');
                }
              }
              m.close();
              refreshAgentCounts();
            }).catch(function(err) {
              saveBtn.disabled = false;
              window.uiAlert('Save failed: ' + (err && err.message || err));
            });
          };
          m.footer.appendChild(cancelBtn);
          m.footer.appendChild(saveBtn);
        }).catch(function(err) {
          window.uiAlert('Failed to load agent: ' + (err && err.message || err));
        });
      });

      // Security & access — the in-chat quick surface for an agent's
      // injection blast-radius controls. Same three AgentRecord fields the
      // full editor's "Access & visibility" section carries (force_private,
      // hidden, allowed_dispatch_targets), here so an owner can tighten a
      // reach without leaving chat. Posts the whole record back to
      // /api/agents (handleAgentList preserves Locked), matching the Tools /
      // Rules modals — no dedicated endpoint.
      window.uiRegisterClientAction('orchestrate_security_modal', function() {
        var id = getAgentID();
        if (!id) { window.uiAlert('Pick an agent first.'); return; }
        // Load the agent record + the fleet in parallel: the record gives
        // current settings, the fleet (minus this agent itself) populates
        // the dispatch-target picker — the same source the editor's
        // ChipPicker reads (OptionsSource: ../api/agents).
        Promise.all([
          fetchAgent(id),
          fetch('api/agents').then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
        ]).then(function(res) {
          var agent = res[0];
          var fleet = (res[1] || []).filter(function(a) { return a.id !== id; });
          var m = openOrchModal('Security & Access — ' + (agent.name || id));

          var help = document.createElement('div');
          help.className = 'ui-orch-modal-help';
          help.textContent = 'Blast-radius controls — limit what this agent can reach if a prompt-injection attempt rides in on fetched or inbound content. These are the same settings as the agent editor’s Access & visibility section, surfaced here for quick access.';
          m.body.appendChild(help);

          var selected = {};
          (agent.allowed_dispatch_targets || []).forEach(function(t) { selected[t] = true; });
          // Resolve the stored dispatch policy (mirrors effectiveDispatchMode on
          // the server): a blank mode with picks is the legacy allowlist ("only").
          var initialMode = agent.dispatch_mode;
          if (['all', 'only', 'except', 'none'].indexOf(initialMode) === -1) {
            initialMode = (Object.keys(selected).length > 0) ? 'only' : 'all';
          }
          var state = {
            force_private: !!agent.force_private,
            hidden: !!agent.hidden,
            dispatch_mode: initialMode
          };

          // --- Toggle rows ---------------------------------------------
          function toggleRow(labelText, helpText, checked, onChange) {
            var row = document.createElement('label');
            row.className = 'ui-orch-sec-toggle';
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!checked;
            cb.addEventListener('change', function() { onChange(cb.checked); });
            row.appendChild(cb);
            var txt = document.createElement('div');
            var nm = document.createElement('div');
            nm.className = 'ui-orch-sec-toggle-name';
            nm.textContent = labelText;
            txt.appendChild(nm);
            var hp = document.createElement('div');
            hp.className = 'ui-orch-sec-toggle-help';
            hp.textContent = helpText;
            txt.appendChild(hp);
            row.appendChild(txt);
            m.body.appendChild(row);
          }

          toggleRow(
            'Force Private mode (network locked off)',
            'Permanently drops network + sub-agent dispatch tools every turn — nothing this agent handles can leave the deployment. For compliance / confidential / family-facing agents.',
            state.force_private,
            function(v) { state.force_private = v; syncDispatch(); });

          toggleRow(
            'Hide from agent fleet',
            'Drops this agent from every other agent’s Available Agents block and refuses inbound dispatch — unless a caller lists it explicitly. Affects fleet routing only; it stays in your Agency picker and its published URL.',
            state.hidden,
            function(v) { state.hidden = v; });

          // --- Dispatch policy -----------------------------------------
          var dh = document.createElement('div');
          dh.className = 'ui-orch-sec-h';
          dh.textContent = 'Dispatch policy — which agents this one may call';
          m.body.appendChild(dh);
          var di = document.createElement('div');
          di.className = 'ui-orch-modal-help';
          di.textContent = 'Which fleet agents this agent may dispatch to via agents(run). Pick a policy; the list modes then let you choose the agents.';
          m.body.appendChild(di);

          var modeSelect = document.createElement('select');
          modeSelect.className = 'ui-orch-sec-filter';
          [['all', 'Allow all — any non-hidden agent (default)'],
           ['only', 'Only allow selected agents'],
           ['except', 'Allow all except selected agents'],
           ['none', 'Allow none — no dispatch at all']].forEach(function(o) {
            var opt = document.createElement('option');
            opt.value = o[0];
            opt.textContent = o[1];
            if (o[0] === state.dispatch_mode) opt.selected = true;
            modeSelect.appendChild(opt);
          });
          modeSelect.addEventListener('change', function() {
            state.dispatch_mode = modeSelect.value;
            syncDispatch();
          });
          m.body.appendChild(modeSelect);

          var filter = document.createElement('input');
          filter.type = 'text';
          filter.className = 'ui-orch-sec-filter';
          filter.placeholder = 'Filter agents…';
          m.body.appendChild(filter);

          var pickList = document.createElement('div');
          pickList.className = 'ui-orch-sec-picklist';
          m.body.appendChild(pickList);

          var count = document.createElement('div');
          count.className = 'ui-orch-sec-count';
          m.body.appendChild(count);

          var dimNote = document.createElement('div');
          dimNote.className = 'ui-orch-sec-dim-note';
          dimNote.textContent = 'Force Private is on — sub-agent dispatch tools are dropped, so this dispatch policy has no effect until you turn it off.';
          m.body.appendChild(dimNote);

          function renderCount() {
            var n = Object.keys(selected).length;
            switch (state.dispatch_mode) {
              case 'all':    count.textContent = 'Can dispatch to any non-hidden agent.'; break;
              case 'none':   count.textContent = 'Cannot dispatch to any agent.'; break;
              case 'only':   count.textContent = n === 0 ? 'Pick the agents this one may call.' : ('Allowed: ' + n + ' agent' + (n === 1 ? '' : 's') + ' — only these.'); break;
              case 'except': count.textContent = n === 0 ? 'Pick the agents to block.' : ('Blocked: ' + n + ' agent' + (n === 1 ? '' : 's') + ' — all other non-hidden agents allowed.'); break;
            }
          }

          function renderPicks() {
            pickList.innerHTML = '';
            if (!fleet.length) {
              var none = document.createElement('div');
              none.className = 'ui-orch-sec-empty';
              none.textContent = 'No other agents in the fleet yet.';
              pickList.appendChild(none);
              return;
            }
            var q = filter.value.trim().toLowerCase();
            fleet.forEach(function(a) {
              var name = a.name || a.id;
              if (q && name.toLowerCase().indexOf(q) === -1 &&
                  (a.description || '').toLowerCase().indexOf(q) === -1) return;
              var row = document.createElement('label');
              row.className = 'ui-orch-sec-pick';
              var cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.checked = !!selected[a.id];
              cb.addEventListener('change', function() {
                if (cb.checked) selected[a.id] = true; else delete selected[a.id];
                renderCount();
              });
              row.appendChild(cb);
              var txt = document.createElement('div');
              var nm = document.createElement('div');
              nm.className = 'ui-orch-sec-pick-name';
              nm.textContent = name;
              if (a.hidden) {
                var badge = document.createElement('span');
                badge.className = 'ui-orch-sec-badge';
                badge.textContent = 'hidden';
                nm.appendChild(badge);
              }
              txt.appendChild(nm);
              if (a.description) {
                var d = document.createElement('div');
                d.className = 'ui-orch-sec-pick-desc';
                d.textContent = a.description;
                txt.appendChild(d);
              }
              row.appendChild(txt);
              pickList.appendChild(row);
            });
          }

          // Show the agent picker only for the list-based policies (only/except),
          // and dim the whole section when Force Private has already dropped the
          // dispatch tools entirely.
          function syncDispatch() {
            var fp = state.force_private;
            var listMode = (state.dispatch_mode === 'only' || state.dispatch_mode === 'except');
            modeSelect.disabled = fp;
            modeSelect.style.opacity = fp ? '0.5' : '';
            dimNote.style.display = fp ? 'block' : 'none';
            var showPicker = listMode && !fp;
            filter.style.display = showPicker ? '' : 'none';
            pickList.style.display = showPicker ? '' : 'none';
            if (showPicker) renderPicks();
            renderCount();
          }

          filter.addEventListener('input', renderPicks);
          syncDispatch();

          // --- Footer --------------------------------------------------
          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'ui-orch-modal-btn';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.onclick = m.close;
          m.footer.appendChild(cancelBtn);

          var saveBtn = document.createElement('button');
          saveBtn.className = 'ui-orch-modal-btn primary';
          saveBtn.textContent = 'Save';
          saveBtn.onclick = function() {
            agent.force_private = state.force_private;
            agent.hidden = state.hidden;
            agent.dispatch_mode = state.dispatch_mode;
            agent.allowed_dispatch_targets = Object.keys(selected);
            saveBtn.disabled = true;
            fetch('api/agents', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(agent)
            }).then(function(r) {
              if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
              m.close();
              refreshAgentCounts();
            }).catch(function(err) {
              saveBtn.disabled = false;
              window.uiAlert('Save failed: ' + (err && err.message || err));
            });
          };
          m.footer.appendChild(saveBtn);
        }).catch(function(err) {
          window.uiAlert('Failed to load agent: ' + (err && err.message || err));
        });
      });

      // Build the shared recurring-task fields (name, directive, pattern, timing)
      // into a modal body. Returns collect() → the JSON body the create/update
      // endpoints accept. Shared by the edit action and the create action so the
      // two forms never drift.
      function buildRecurringFields(m, task) {
        task = task || {};
        function labeled(labelText, inputEl) {
          var wrap = document.createElement('label');
          wrap.style.cssText = 'display:block;margin:0.4rem 0';
          var lb = document.createElement('div');
          lb.className = 'ui-orch-sec-toggle-help';
          lb.textContent = labelText;
          wrap.appendChild(lb);
          wrap.appendChild(inputEl);
          return wrap;
        }
        function num(val) {
          var i = document.createElement('input');
          i.type = 'number'; i.min = '0';
          i.className = 'ui-orch-sec-filter';
          i.value = (val ? String(val) : '');
          return i;
        }
        function timeI(val) {
          var i = document.createElement('input');
          i.type = 'time'; i.step = '60'; i.className = 'ui-orch-sec-filter';
          if (val) i.value = val;
          return i;
        }

        // Name — identifies the task on its report cards and in the rail.
        var nameH = document.createElement('div');
        nameH.className = 'ui-orch-sec-h';
        nameH.textContent = 'Name';
        m.body.appendChild(nameH);
        var nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'ui-orch-sec-filter';
        nameInput.value = task.name || '';
        nameInput.placeholder = "(defaults to the directive's first line)";
        nameInput.style.cssText = 'margin-bottom:0.6rem';
        m.body.appendChild(nameInput);

        // Directive (run each fire).
        var ph = document.createElement('div');
        ph.className = 'ui-orch-sec-h';
        ph.textContent = 'Directive (run each fire)';
        m.body.appendChild(ph);
        var promptInput = document.createElement('textarea');
        promptInput.className = 'ui-orch-sec-filter';
        promptInput.rows = 6;
        promptInput.style.cssText = 'width:100%;white-space:pre-wrap;margin-bottom:0.6rem;resize:vertical';
        promptInput.value = task.prompt || '';
        promptInput.placeholder = 'What the agent should do each time it fires (no timing here). e.g. "check the build, post if it is red"';
        m.body.appendChild(promptInput);

        var patternSel = document.createElement('select');
        patternSel.className = 'ui-orch-sec-filter';
        [['fixed', 'Fixed — every N minutes'], ['random', 'Random']].forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o[0]; opt.textContent = o[1];
          if (o[0] === (task.pattern || 'fixed')) opt.selected = true;
          patternSel.appendChild(opt);
        });
        m.body.appendChild(labeled('Pattern', patternSel));

        var interval = num(task.interval_minutes);
        var timesPerDay = num(task.times_per_day);
        var minGap = num(task.min_gap_minutes);
        var maxGap = num(task.max_gap_minutes);
        var fromI = timeI(task.has_window ? task.active_from : '');
        var toI = timeI(task.has_window ? task.active_to : '');
        var maxFires = num(task.max_fires);
        // Indefinite is stored as max_fires = 0. That is invisible in a blank
        // number field, which reads as "unset" rather than as a decision — and
        // a cap someone else set (an agent authoring the task through the
        // recurring tool) looks identical to no cap at all until you open this
        // modal. A checkbox makes the current state legible at a glance and
        // makes "run forever" an explicit choice rather than an empty input.
        var indefinite = document.createElement('input');
        indefinite.type = 'checkbox';
        indefinite.checked = !(parseInt(task.max_fires, 10) > 0);

        var fixedRow = labeled('Every N minutes', interval);
        var timesRow = labeled('Times per day (blank = unlimited)', timesPerDay);
        var minGapRow = labeled('Min minutes between fires', minGap);
        var maxGapRow = labeled('Max minutes between fires (unlimited random)', maxGap);
        [fixedRow, timesRow, minGapRow, maxGapRow].forEach(function(x) { m.body.appendChild(x); });
        m.body.appendChild(labeled('Active window from (HH:MM, optional)', fromI));
        m.body.appendChild(labeled('Active window to (HH:MM, optional)', toI));
        var indefRow = labeled('Run indefinitely (no total-fire cap)', indefinite);
        m.body.appendChild(indefRow);
        var maxFiresRow = labeled('Max total fires (stop after this many)', maxFires);
        m.body.appendChild(maxFiresRow);
        function syncIndefinite() {
          maxFiresRow.style.display = indefinite.checked ? 'none' : '';
        }
        indefinite.addEventListener('change', syncIndefinite);
        syncIndefinite();

        function syncPattern() {
          var isRandom = patternSel.value === 'random';
          fixedRow.style.display = isRandom ? 'none' : '';
          timesRow.style.display = isRandom ? '' : 'none';
          minGapRow.style.display = isRandom ? '' : 'none';
          maxGapRow.style.display = isRandom ? '' : 'none';
        }
        patternSel.addEventListener('change', syncPattern);
        syncPattern();

        return function collect() {
          function iv(x) { var n = parseInt(x.value, 10); return isNaN(n) ? 0 : n; }
          return {
            name: nameInput.value.trim(),
            prompt: promptInput.value,
            pattern: patternSel.value,
            interval_minutes: iv(interval),
            times_per_day: iv(timesPerDay),
            min_gap_minutes: iv(minGap),
            max_gap_minutes: iv(maxGap),
            active_from: fromI.value.trim(),
            active_to: toI.value.trim(),
            // Checked → 0, the stored form of "indefinite". Explicit rather
            // than relying on a blank field, so the intent round-trips.
            max_fires: indefinite.checked ? 0 : iv(maxFires)
          };
        };
      }

      // Edit a recurring task from the Schedules rail (row click → this action).
      // Loads the task's editable fields and posts changes to the update route,
      // which reschedules in place (agent/session + fire history preserved).
      window.uiRegisterClientAction('orchestrate_edit_schedule', function(ctx) {
        var id = ctx && ctx.id;
        if (!id) return;
        fetch('api/console/recurring/get?id=' + encodeURIComponent(id))
          .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function(task) {
            var m = openOrchModal('Recurring task');
            var help = document.createElement('div');
            help.className = 'ui-orch-modal-help';
            help.textContent = 'This task runs ' + (task.cadence || '') + ' · fired ' + (task.fire_count || 0) + ' time(s). Edit its name, directive, and timing below, or run it now / delete it.';
            m.body.appendChild(help);

            var collect = buildRecurringFields(m, task);

            // Delete — remove the task entirely (backend /delete). Confirmed,
            // since it's destructive and can't be undone.
            var delBtn = document.createElement('button');
            delBtn.className = 'ui-orch-modal-btn';
            delBtn.textContent = 'Delete';
            delBtn.title = 'Remove this recurring task permanently';
            delBtn.onclick = function() {
              Promise.resolve(window.uiConfirm ? window.uiConfirm('Delete this recurring task? This cannot be undone.') : window.confirm('Delete this recurring task?')).then(function(ok) {
                if (!ok) return;
                delBtn.disabled = true;
                fetch('api/console/recurring/delete?id=' + encodeURIComponent(id), { method: 'POST' })
                  .then(function(r) { if (!r.ok) return r.text().then(function(t) { throw new Error(t); }); m.close(); if (ctx.reload) ctx.reload(); })
                  .catch(function(err) { delBtn.disabled = false; window.uiAlert('Delete failed: ' + (err && err.message || err)); });
              });
            };
            m.footer.appendChild(delBtn);

            // Run now — fire once immediately (backend /run). Does NOT touch the
            // schedule or consume the fire budget; the reply lands in the thread.
            var runBtn = document.createElement('button');
            runBtn.className = 'ui-orch-modal-btn';
            runBtn.textContent = 'Run now';
            runBtn.title = 'Fire this task once now (does not affect its schedule)';
            runBtn.onclick = function() {
              runBtn.disabled = true;
              fetch('api/console/recurring/run?id=' + encodeURIComponent(id), { method: 'POST' })
                .then(function(r) {
                  if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
                  runBtn.disabled = false;
                  window.uiAlert('Fired once — its reply will appear in the thread shortly.');
                })
                .catch(function(err) { runBtn.disabled = false; window.uiAlert('Run failed: ' + (err && err.message || err)); });
            };
            m.footer.appendChild(runBtn);

            var cancelBtn = document.createElement('button');
            cancelBtn.className = 'ui-orch-modal-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = m.close;
            m.footer.appendChild(cancelBtn);

            var saveBtn = document.createElement('button');
            saveBtn.className = 'ui-orch-modal-btn primary';
            saveBtn.textContent = 'Save';
            saveBtn.onclick = function() {
              saveBtn.disabled = true;
              fetch('api/console/recurring/update?id=' + encodeURIComponent(id), {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(collect())
              }).then(function(r) {
                if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
                m.close();
                if (ctx.reload) ctx.reload();
              }).catch(function(err) {
                saveBtn.disabled = false;
                window.uiAlert('Update failed: ' + (err && err.message || err));
              });
            };
            m.footer.appendChild(saveBtn);
          })
          .catch(function(err) { window.uiAlert('Could not load task: ' + (err && err.message || err)); });
      });

      // Create a NEW recurring task from the Scheduler modal's "New recurring
      // task" button (cfg.schedule_creators → this client action). The agent is
      // the rail's current agent (window.GOHORT_AGENT_ID); the task attaches to
      // the open thread (ctx.sessionId), or the agent's home thread when none is
      // open (the server defaults it). Posts to the create route.
      window.uiRegisterClientAction('orchestrate_new_recurring', function(ctx) {
        var agentId = window.GOHORT_AGENT_ID || '';
        if (!agentId) { window.uiAlert('Pick an agent first.'); return; }
        var m = openOrchModal('New recurring task');
        var help = document.createElement('div');
        help.className = 'ui-orch-modal-help';
        help.textContent = 'Runs this agent on a timer, posting each result into its thread. Give it a directive and a cadence.';
        m.body.appendChild(help);

        var collect = buildRecurringFields(m, {pattern: 'fixed', interval_minutes: 30});

        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'ui-orch-modal-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = m.close;
        m.footer.appendChild(cancelBtn);

        var createBtn = document.createElement('button');
        createBtn.className = 'ui-orch-modal-btn primary';
        createBtn.textContent = 'Create';
        createBtn.onclick = function() {
          var body = collect();
          if (!body.prompt.trim()) { window.uiAlert('Enter a directive for the task.'); return; }
          body.agent_id = agentId;
          body.session_id = (ctx && ctx.sessionId) || '';
          createBtn.disabled = true;
          fetch('api/console/recurring/create', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
          }).then(function(r) {
            if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
            m.close();
            if (ctx && ctx.reload) ctx.reload();
          }).catch(function(err) {
            createBtn.disabled = false;
            window.uiAlert('Create failed: ' + (err && err.message || err));
          });
        };
        m.footer.appendChild(createBtn);
      });

      // Small shared field helpers for the schedule edit modals below.
      function schedLabeled(labelText, inputEl) {
        var wrap = document.createElement('label');
        wrap.style.cssText = 'display:block;margin:0.4rem 0';
        var lb = document.createElement('div');
        lb.className = 'ui-orch-sec-toggle-help';
        lb.textContent = labelText;
        wrap.appendChild(lb);
        wrap.appendChild(inputEl);
        return wrap;
      }
      function schedNum(val, min) {
        var i = document.createElement('input');
        i.type = 'number'; i.min = (min == null ? '0' : String(min));
        i.className = 'ui-orch-sec-filter';
        i.value = (val ? String(val) : '');
        return i;
      }
      function schedTxt(val, phold) {
        var i = document.createElement('input');
        i.type = 'text'; i.className = 'ui-orch-sec-filter';
        i.value = val || ''; i.placeholder = phold || '';
        return i;
      }
      // schedSelect builds a select from [value, label] pairs, pre-selecting the
      // given value. The single option-picker the schedule modals share so a user
      // never types a raw cron / duration string.
      function schedSelect(options, selected) {
        var s = document.createElement('select');
        s.className = 'ui-orch-sec-filter';
        options.forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o[0]; opt.textContent = o[1];
          if (o[0] === selected) opt.selected = true;
          s.appendChild(opt);
        });
        return s;
      }
      // schedTime builds a native time picker (HH:MM, local). Emits the exact
      // zero-padded "HH:MM" the cron parser expects.
      function schedTime(val) {
        var i = document.createElement('input');
        i.type = 'time'; i.step = '60'; i.className = 'ui-orch-sec-filter';
        if (val) i.value = val;
        return i;
      }
      function schedButtons(m, saveBtn) {
        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'ui-orch-modal-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = m.close;
        m.footer.appendChild(cancelBtn);
        m.footer.appendChild(saveBtn);
      }

      // Edit an EVENT MONITOR's poll interval from the Scheduler modal. Webhook
      // monitors are push-only and carry no edit affordance, so this always
      // targets a schedulable (poll / http_poll / watch) monitor.
      window.uiRegisterClientAction('orchestrate_edit_monitor', function(ctx) {
        var id = ctx && ctx.id;
        if (!id) return;
        fetch('api/console/monitors/get?id=' + encodeURIComponent(id))
          .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function(mon) {
            var m = openOrchModal('Event monitor');
            var help = document.createElement('div');
            help.className = 'ui-orch-modal-help';
            help.textContent = '“' + (mon.name || '') + '” (' + (mon.kind || 'monitor') + ') checks on a fixed interval. Edit how often it runs.';
            m.body.appendChild(help);

            if (!mon.schedulable) {
              var note = document.createElement('div');
              note.className = 'ui-orch-sec-pick-desc';
              note.textContent = 'This monitor is push-triggered — there is no interval to edit.';
              m.body.appendChild(note);
              return;
            }

            // Interval as a value + unit picker instead of a raw seconds box:
            // pick "every 5 minutes" / "every 2 hours" from options, not math.
            // Derive the friendliest unit from the stored seconds on load.
            var storedSecs = mon.interval_seconds || 60;
            var unit = 'seconds', val = storedSecs;
            if (storedSecs % 3600 === 0) { unit = 'hours'; val = storedSecs / 3600; }
            else if (storedSecs % 60 === 0) { unit = 'minutes'; val = storedSecs / 60; }
            var everyVal = schedNum(val, 1);
            var unitSel = schedSelect([['seconds', 'seconds'], ['minutes', 'minutes'], ['hours', 'hours']], unit);
            var row = document.createElement('div');
            row.style.cssText = 'display:flex;gap:0.5rem;align-items:center';
            everyVal.style.maxWidth = '6rem';
            row.appendChild(everyVal); row.appendChild(unitSel);
            m.body.appendChild(schedLabeled('Check every', row));

            function unitSecs(u) { return u === 'hours' ? 3600 : (u === 'minutes' ? 60 : 1); }
            var saveBtn = document.createElement('button');
            saveBtn.className = 'ui-orch-modal-btn primary';
            saveBtn.textContent = 'Save';
            saveBtn.onclick = function() {
              var v = parseInt(everyVal.value, 10);
              var n = (isNaN(v) ? 0 : v) * unitSecs(unitSel.value);
              if (n < 5) { window.uiAlert('Interval must be at least 5 seconds.'); return; }
              saveBtn.disabled = true;
              fetch('api/console/monitors/update?id=' + encodeURIComponent(id), {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({interval_seconds: n})
              }).then(function(r) {
                if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
                m.close();
                if (ctx.reload) ctx.reload();
              }).catch(function(err) {
                saveBtn.disabled = false;
                window.uiAlert('Update failed: ' + (err && err.message || err));
              });
            };
            schedButtons(m, saveBtn);
          })
          .catch(function(err) { window.uiAlert('Could not load monitor: ' + (err && err.message || err)); });
      });

      // Edit a SCHEDULED (standing) AGENT's schedule from the Scheduler modal:
      // a cron spec OR an interval. Cron wins when both are set (matches the
      // server), so the modal notes that and clears the other on save.
      window.uiRegisterClientAction('orchestrate_edit_standing', function(ctx) {
        var id = ctx && ctx.id;
        if (!id) return;
        fetch('api/console/agents/get?id=' + encodeURIComponent(id))
          .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function(sa) {
            var m = openOrchModal('Scheduled agent');
            var help = document.createElement('div');
            help.className = 'ui-orch-modal-help';
            help.textContent = '“' + (sa.name || '') + '” runs ' + (sa.schedule_label || 'on a schedule') + '. Choose when it runs.';
            m.body.appendChild(help);

            var DAYS = [['MON', 'Mon'], ['TUE', 'Tue'], ['WED', 'Wed'], ['THU', 'Thu'], ['FRI', 'Fri'], ['SAT', 'Sat'], ['SUN', 'Sun']];

            // Frequency drives which time controls show — no cron string typed.
            var freq = schedSelect([
              ['interval', 'Every N minutes'],
              ['daily', 'Every day'],
              ['weekdays', 'Weekdays (Mon–Fri)'],
              ['weekends', 'Weekends (Sat–Sun)'],
              ['weekly', 'Weekly on a day'],
              ['custom', 'Specific days']
            ], 'daily');
            m.body.appendChild(schedLabeled('Frequency', freq));

            var interval = schedNum(sa.interval_minutes || 60, 1);
            var intervalRow = schedLabeled('Every N minutes', interval);
            m.body.appendChild(intervalRow);

            var timeInput = schedTime('');
            var timeRow = schedLabeled('At time (local)', timeInput);
            m.body.appendChild(timeRow);

            var weekdaySel = schedSelect(DAYS, 'MON');
            var weeklyRow = schedLabeled('On day', weekdaySel);
            m.body.appendChild(weeklyRow);

            var customWrap = document.createElement('div');
            customWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:0.6rem;margin:0.2rem 0';
            var dayBoxes = DAYS.map(function(d) {
              var lbl = document.createElement('label');
              lbl.style.cssText = 'display:inline-flex;align-items:center;gap:0.3rem;font-size:0.85rem';
              var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = d[0];
              lbl.appendChild(cb); lbl.appendChild(document.createTextNode(d[1]));
              customWrap.appendChild(lbl);
              return cb;
            });
            var customRow = schedLabeled('On days', customWrap);
            m.body.appendChild(customRow);

            function show(el, on) { el.style.display = on ? '' : 'none'; }
            function sync() {
              var f = freq.value;
              show(intervalRow, f === 'interval');
              show(timeRow, f !== 'interval');
              show(weeklyRow, f === 'weekly');
              show(customRow, f === 'custom');
            }
            freq.addEventListener('change', sync);

            // Prefill the controls from the agent's current schedule so an edit
            // starts from what's set, not a blank default.
            (function prefill() {
              var cron = (sa.cron || '').trim();
              if (!cron && (sa.interval_minutes || 0) > 0) { freq.value = 'interval'; return; }
              var parts = cron.split(/\s+/);
              if (parts.length === 2) {
                var days = parts[0].toLowerCase(), hhmm = parts[1];
                if (/^\d{1,2}:\d{2}$/.test(hhmm)) { timeInput.value = hhmm.length === 4 ? '0' + hhmm : hhmm; }
                if (days === 'daily' || days === 'everyday') { freq.value = 'daily'; }
                else if (days === 'weekdays') { freq.value = 'weekdays'; }
                else if (days === 'weekends') { freq.value = 'weekends'; }
                else {
                  var toks = days.split(',').map(function(s) { return s.trim().slice(0, 3).toUpperCase(); }).filter(Boolean);
                  if (toks.length === 1) { freq.value = 'weekly'; weekdaySel.value = toks[0]; }
                  else { freq.value = 'custom'; dayBoxes.forEach(function(cb) { cb.checked = toks.indexOf(cb.value) >= 0; }); }
                }
              }
            })();
            if (!timeInput.value) timeInput.value = '09:00';
            sync();

            var saveBtn = document.createElement('button');
            saveBtn.className = 'ui-orch-modal-btn primary';
            saveBtn.textContent = 'Save';
            saveBtn.onclick = function() {
              var f = freq.value, cronVal = '', iv = 0;
              if (f === 'interval') {
                iv = parseInt(interval.value, 10);
                if (isNaN(iv) || iv < 1) { window.uiAlert('Enter a minute interval of 1 or more.'); return; }
              } else {
                var hhmm = timeInput.value;
                if (!/^\d{1,2}:\d{2}$/.test(hhmm)) { window.uiAlert('Pick a time of day.'); return; }
                var daysTok = '';
                if (f === 'daily') daysTok = 'daily';
                else if (f === 'weekdays') daysTok = 'weekdays';
                else if (f === 'weekends') daysTok = 'weekends';
                else if (f === 'weekly') daysTok = weekdaySel.value;
                else if (f === 'custom') {
                  var sel = dayBoxes.filter(function(cb) { return cb.checked; }).map(function(cb) { return cb.value; });
                  if (!sel.length) { window.uiAlert('Pick at least one day.'); return; }
                  daysTok = sel.join(',');
                }
                cronVal = daysTok + ' ' + hhmm;
              }
              saveBtn.disabled = true;
              fetch('api/console/agents/update?id=' + encodeURIComponent(id), {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cron: cronVal, interval_minutes: iv})
              }).then(function(r) {
                if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
                m.close();
                if (ctx.reload) ctx.reload();
              }).catch(function(err) {
                saveBtn.disabled = false;
                window.uiAlert('Update failed: ' + (err && err.message || err));
              });
            };
            schedButtons(m, saveBtn);
          })
          .catch(function(err) { window.uiAlert('Could not load agent: ' + (err && err.message || err)); });
      });

      // --- Per-agent count refresh on the Tools / Memory / Rules buttons ---
      // Find the toolbar buttons by their visible label text and append
      // a "(N)" suffix that reflects the active agent's state. Refresh
      // on agent change (the dropdown's change event already triggers
      // a new-session reset; this listener piggybacks).
      function refreshAgentCounts() {
        var id = getAgentID();
        // Buttons may live in either the actions bar or the modes
        // row (relocated by relocateContextButtons). Match by label
        // anywhere inside the panel so the lookup survives the move.
        var btns = document.querySelectorAll('.ui-agent-actions .ui-row-btn, .ui-agent-modes .ui-row-btn');
        var tools = null, memory = null, rules = null, deleteBtn = null;
        btns.forEach(function(b) {
          var t = b.textContent.replace(/\s*\([^)]*\)\s*$/, '').trim();
          if (t === 'Tools') tools = b;
          else if (t === 'Memory') memory = b;
          else if (t === 'Rules') rules = b;
          else if (t === 'Delete' || t === 'Revert') deleteBtn = b;
        });
        // Seed agents present the Delete button as "Revert" since the
        // backend interprets DELETE on a seed-id as "drop the shadow
        // and fall back to the framework default" rather than a full
        // record removal.
        if (deleteBtn) {
          var asSeed = id && id.indexOf('seed-') === 0;
          deleteBtn.textContent = asSeed ? 'Revert' : 'Delete';
          deleteBtn.title = asSeed
            ? 'Discard your customizations and restore framework defaults for this seed agent.'
            : 'Delete the active agent';
        }
        // Builder lockdown — when the active agent is the Builder
        // seed, hide the chrome that would let a user edit it or
        // pollute its structurally-constrained authoring purpose:
        // Edit/Clone/Delete (no point editing a locked seed agent),
        // Private and Clean (network is a hard requirement; clean-
        // slate framing doesn't fit authoring). Memory stays exposed
        // because Builder NOW has a "Lessons learned" log the user
        // should be able to review and prune. Rules stays exposed
        // for the same reason — admin-curated standing guidance is
        // legitimate customization (not accumulated state) and lets
        // an operator shape Builder's authoring rhythm without
        // forking the seed.
        //
        // Tools stays VISIBLE for Builder even though its catalog
        // is implicit (the AllowedTools checklist has no effect):
        // the same modal surfaces SESSION tools — drafts Builder's
        // workers authored mid-conversation via tool_def — and
        // those need an admin remove path. Without this, drafts

        }).then(function(a) {

          var catalog = (window.ORCH_TOOL_CATALOG || []);
          var internet = (window.ORCH_INTERNET_TOOLS || []);

          // Append only when present so the count stays unsurprising

          // is already in the global catalog (user-wide persistent

          var catalogNamesForCount = {};

          // an idle count of "23 / 45" doesn't suggest there's
          // something to manage in the catalog when there isn't.
          var isBuilder = (id === 'seed-builder');

          if (!isBuilder && customN > 0) {

      }
      // Initial + on-change refresh. watchAgentSwitchForNewSession

      var intakeWrap = null;

              box.value = val;

                inp.dataset.value = val;
