                  subMaster.className = 'ui-checklist-cb ui-checklist-master';
                  subMaster.addEventListener('click', function(ev) {
                    ev.stopPropagation();

                    refreshScopedTree();
                  });
                  subHeader.appendChild(subMaster);
                }
                var subLabel = document.createElement('span');
                subLabel.className = 'ui-checklist-group-name';
                subLabel.textContent = b.name + ' (' + b.items.length + ')';
                subHeader.appendChild(subLabel);
                sub.appendChild(subHeader);

                var subBody = document.createElement('div');
                subBody.className = 'ui-checklist-section-body';
                // Open. The parent's caret already hides all of this; asking for
                // a second click to reach three rows is a toll, not a tree.
                subHeader.addEventListener('click', function(ev) {
                  if (subMaster && ev.target === subMaster) return;
                  var open = subBody.style.display !== 'none';
                  subBody.style.display = open ? 'none' : '';
                  subCaret.textContent = open ? '▸' : '▾';
                });
                sub.appendChild(subBody);
                b.items.forEach(function(t) { addScopedRow(t, scopedRowIdx++, subBody, bucketCbs); });
                if (subMaster) scopedSubs.push({master: subMaster, cbs: bucketCbs});
                scopedBody.appendChild(sub);
              });
            }
            refreshScopedTree();
            list.appendChild(customSection);
          }

          // Builder gets a READ-ONLY catalog listing instead of the
          // checklist — its tool set is code-driven, so checkboxes
          // would be a knob that does nothing, but rendering NOTHING
          // (the old behavior) read as "Builder has no tools", which
          // is worse: the runtime catalog is full (the seed's
          // allowed_tools plus the authoring set appended at
          // catalog-assembly time). List what it actually runs with.
          if (isBuilder) {
            var fixedSection = document.createElement('div');
            fixedSection.className = 'ui-orch-custom-tools';
            var fh = document.createElement('div');
            fh.className = 'ui-orch-custom-tools-h';
            fh.textContent = 'Framework-fixed catalog (read-only)';
            fixedSection.appendChild(fh);
            var catalogHelp = {};
            catalog.forEach(function(o) { catalogHelp[o.value] = o.help || ''; });
            (agent.allowed_tools || []).forEach(function(n) {
              var row = document.createElement('div');
              row.className = 'ui-orch-custom-tool';
              var meta = document.createElement('div');
              meta.className = 'ui-orch-custom-tool-meta';
              var nm = document.createElement('div');
              nm.className = 'ui-orch-custom-tool-name';
              nm.textContent = n;
              meta.appendChild(nm);
              if (catalogHelp[n]) {
                var desc = document.createElement('div');
                desc.className = 'ui-orch-custom-tool-desc';
                desc.textContent = catalogHelp[n];
                meta.appendChild(desc);
              }
              row.appendChild(meta);
              fixedSection.appendChild(row);
            });
            var fnote = document.createElement('div');
            fnote.className = 'ui-orch-custom-tools-help';
            fnote.textContent = 'Plus the authoring set appended at runtime: create_agent / update_agent / clone_agent / delete_agent, tool_def, add_tool, skill_def, app_def, pipeline, credential drafting, agents (list / get / run), and the build-plan cards.';
            fixedSection.appendChild(fnote);
            list.appendChild(fixedSection);
            m.body.appendChild(list);
          } else {
          // Bucket the tools by group so each section can be rendered
          // as a collapsible block with its own master checkbox. Order
          // of first-occurrence is preserved (server-side sort already
          // clusters groups together; we just consume them in order).
          var groups = []; // [{name, items: [option, ...]}]
          var groupIdx = {};
          catalog.forEach(function(o) {
            var grp = o.group || '';
            if (!(grp in groupIdx)) {
              groupIdx[grp] = groups.length;
              groups.push({name: grp, items: []});
            }
            groups[groupIdx[grp]].items.push(o);
          });
          groups.forEach(function(g) {
            var section = document.createElement('div');
            section.className = 'ui-checklist-section';
            var header = document.createElement('div');
            header.className = 'ui-checklist-group ui-checklist-group-collapsible';
            // Caret toggles collapsed state. Section starts collapsed
            // so the modal isn't a wall of checkboxes on open.
            var caret = document.createElement('span');
            caret.className = 'ui-checklist-caret';
            caret.textContent = '▸';
            header.appendChild(caret);
            // Master checkbox: toggles every child checkbox in this
            // group. Tri-state: unchecked / indeterminate / checked
            // reflect the children's combined state. Click toggles
            // toward all-checked if any are unchecked, else all-off.
            var master = document.createElement('input');
            master.type = 'checkbox';
            master.className = 'ui-checklist-cb ui-checklist-master';
            master.addEventListener('click', function(ev) {
              ev.stopPropagation();
              var want = master.checked; // browser already flipped it
              g.items.forEach(function(o, idx) {
                var cb = g._cbs[idx];
                cb.checked = want;
              });
              master.indeterminate = false;
            });
            header.appendChild(master);
            var label = document.createElement('span');
            label.className = 'ui-checklist-group-name';
            label.textContent = g.name || '(ungrouped)';
            header.appendChild(label);
            section.appendChild(header);

            var body = document.createElement('div');
            body.className = 'ui-checklist-section-body';
            body.style.display = 'none'; // collapsed by default
            g._cbs = [];
            g.items.forEach(function(o) {
              var row = document.createElement('label');
              row.className = 'ui-checklist-row';
              var cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.className = 'ui-checklist-cb';
              cb.value = o.value;
              cb.checked = !!allowed[o.value];
              cb.addEventListener('change', function() {
                refreshMaster(g, master);
              });
              row.appendChild(cb);
              var lbl = document.createElement('div');
              lbl.className = 'ui-checklist-lbl';
              var nm = document.createElement('span');
              nm.className = 'ui-checklist-name';
              nm.textContent = o.label || o.value;
              lbl.appendChild(nm);
              if (o.help) {
                var hp = document.createElement('span');
                hp.className = 'ui-checklist-help';
                hp.textContent = o.help;
                lbl.appendChild(hp);
              }
              row.appendChild(lbl);
              body.appendChild(row);
              checkboxes.push(cb);
              g._cbs.push(cb);
            });
            // Click anywhere on the header (except the master checkbox)
            // toggles collapsed state. Caret rotates as a visual cue.
            header.addEventListener('click', function(ev) {
              if (ev.target === master) return;
              var open = body.style.display !== 'none';
              body.style.display = open ? 'none' : '';
              caret.textContent = open ? '▸' : '▾';
            });
            section.appendChild(body);
            list.appendChild(section);
            refreshMaster(g, master);
          });
          function refreshMaster(g, master) {
            var on = 0;
            g._cbs.forEach(function(cb) { if (cb.checked) on++; });
            if (on === 0) {
              master.checked = false;
              master.indeterminate = false;
            } else if (on === g._cbs.length) {
              master.checked = true;
              master.indeterminate = false;
            } else {
              master.checked = false;
              master.indeterminate = true;
            }
          }
          m.body.appendChild(list);
          } // end !isBuilder catalog block
          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'ui-orch-modal-btn';
          cancelBtn.textContent = isBuilder ? 'Close' : 'Cancel';
          cancelBtn.onclick = m.close;
          m.footer.appendChild(cancelBtn);
          if (!isBuilder) {
            var saveBtn = document.createElement('button');
            saveBtn.className = 'ui-orch-modal-btn primary';
            saveBtn.textContent = 'Save';
            saveBtn.onclick = function() {
              var picked = [];
              checkboxes.forEach(function(cb) { if (cb.checked) picked.push(cb.value); });
              // "All checked"  → empty list (default pool, future tools auto-include).
              // "None checked" → ["__none__"] sentinel (explicit "no optional tools").
              //                  Bare empty list would round-trip to default pool which
              //                  silently undoes the user's intent.
              // "Some checked" → literal name list.
              if (picked.length === checkboxes.length) {
                picked = [];
              } else if (picked.length === 0) {
                picked = ['__none__'];
              }
              agent.allowed_tools = picked;
              // Scoped tools carry their decision in the deny list instead:
              // they are never allowed_tools options, so "not in the picked
              // list" says nothing about them. Rebuild only OUR names — the
              // existing entries for pool tools stay untouched (the server
              // recomputes those from the checklist for seed agents).
              var scopedNames = {};
              scopedCbs.forEach(function(cb) { scopedNames[cb.value] = true; });
              var denied = (agent.disabled_persistent_tools || []).filter(function(n) {
                return !scopedNames[n];
              });
              scopedCbs.forEach(function(cb) { if (!cb.checked) denied.push(cb.value); });
              agent.disabled_persistent_tools = denied;
              saveBtn.disabled = true;
              fetch('api/agents?tools_modal=1', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(agent),
              }).then(function(r) {
                if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
                m.close();
                refreshAgentCounts();
              }).catch(function(err) {
                saveBtn.disabled = false;
                window.uiAlert('Save failed: ' + (err && err.message || err));
              });
            };
            m.footer.appendChild(saveBtn);
          }
        }).catch(function(err) {
          window.uiAlert('Failed to load agent: ' + (err && err.message || err));
        });
      });

      window.uiRegisterClientAction('orchestrate_memory_modal', function() {
        var id = getAgentID();
        if (!id) { window.uiAlert('Pick an agent first.'); return; }
        // Memory modal now shows two sections:
        //   1. Explicit Memory (always-in-prompt facts via store_fact).
        //      The block header / intro come from the agent's MemoryMode
        //      ("Lessons learned" for agent-mode, "Saved notes" for
        //      chatbot-mode). Editable list; save POSTs to /facts which
        //      replaces the underlying MemoryFact rows.
        //   2. Reference Memory (vector-grown derived chunks via
        //      memory_save / synthesis ingest). Read-only list with
        //      delete-per-entry. Lets users prune drift without editing
        //      embeddings in place (edits don't make sense for vectors).
        // The old AgentMemory.Notes section (auto-consolidator output)
        // is gone — Memory is now 100% LLM-driven.
        var factsURL = 'api/agents/' + encodeURIComponent(id) + '/facts';
        var agentURL = 'api/agents/' + encodeURIComponent(id);
        var m = openOrchModal('Memory');
        // Section visibility gates — flipped after the agent record
        // loads. Sections always build in the DOM (simpler than
        // conditional construction) but hide when the corresponding
        // disable flag is set on the agent.
        var disabledNotice = document.createElement('div');
        disabledNotice.style.cssText = 'color:var(--text-mute);font-style:italic;padding:1rem 0;text-align:center;display:none';
        disabledNotice.textContent = 'Both Explicit and Reference Memory are disabled for this agent — nothing to manage here.';
        m.body.appendChild(disabledNotice);
        fetch(agentURL).then(function(r){ return r.ok ? r.json() : null; }).then(function(a) {
          if (!a) return;
          if (a.disable_explicit) factsSection.style.display = 'none';
          if (a.disable_inferred) inferredSection.style.display = 'none';
          // Graph memory rides the Explicit gate (same !explicitOff attach as
          // store_fact), so it hides whenever Saved facts do.
          if (a.disable_explicit && typeof graphSection !== 'undefined') graphSection.style.display = 'none';
          if (a.disable_explicit && a.disable_inferred) {
            disabledNotice.style.display = '';
          }
        }).catch(function(){});
        // Collapsible section helper — wraps a clickable title with a
        // caret and hides the listed content elements until clicked.
        // Both memory sections (facts + reference) use this so the
        // modal opens compact (just two title rows) and the user picks
        // which one to drill into, rather than scrolling through every
        // entry of both at once.
        function makeCollapsible(titleEl, contentEls, startExpanded) {
          titleEl.style.cursor = 'pointer';
          titleEl.style.userSelect = 'none';
          var caret = document.createElement('span');
          caret.style.cssText = 'margin-right:0.4rem;display:inline-block;color:var(--text-mute);transition:transform 0.15s';
          caret.textContent = String.fromCharCode(9656); // ▸
          titleEl.insertBefore(caret, titleEl.firstChild);
          var open = !!startExpanded;
          function apply() {
            caret.style.transform = open ? 'rotate(90deg)' : '';
            contentEls.forEach(function(el) { if (el) el.style.display = open ? '' : 'none'; });
          }
          titleEl.addEventListener('click', function(ev) {
            ev.stopPropagation();
            open = !open;
            apply();
          });
          apply();
        }

        // --- Search section ---
        // One box over every memory layer, two modes:
        //   Stored text — literal sweep of what's stored (facts, findings,
        //     knowledge, cortex observations, working notes).
        //   Recall preview — runs the agent's OWN recall pipeline for the
        //     query and shows exactly what a turn would inject, ranked.
        //     The item steering the agent wrong is usually at the top.
        // Every deletable hit gets an inline remove button, so find-and-fix
        // is one surface. Endpoint: api/agents/<id>/memsearch.
        var memsearchURL = 'api/agents/' + encodeURIComponent(id) + '/memsearch';
        var searchSection = document.createElement('div');
        searchSection.style.cssText = 'margin-bottom:1rem;padding-bottom:0.8rem;border-bottom:1px solid var(--border)';
        var searchRow = document.createElement('div');
        searchRow.style.cssText = 'display:flex;gap:0.4rem;align-items:center';

        searchInput.placeholder = 'Search this agent’s memory…';
        searchInput.style.cssText = 'flex:1;background:var(--bg-0);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.35rem 0.55rem;font:inherit';
        searchRow.appendChild(searchInput);
        var searchMode = 'grep';
        function modeBtn(label, mode, title) {

          b.type = 'button';
          b.textContent = label;

          b.onclick = function() {
            searchMode = mode;
            styleModeBtns();
            if (searchInput.value.trim()) runMemSearch();
          };
          b._mode = mode;
          return b;
        }
        var grepBtn = modeBtn('Stored text', 'grep', 'Literal search of everything stored: facts, findings, knowledge, cortex observations, working notes.');
        var recallBtn = modeBtn('Recall preview', 'recall', 'Run the agent’s own recall pipeline for this query and show exactly what a turn would inject, ranked.');
        function styleModeBtns() {
          [grepBtn, recallBtn].forEach(function(b) {
            var on = b._mode === searchMode;
            b.style.background = on ? 'var(--accent, #6366f1)' : 'var(--bg-1)';
            b.style.color = on ? '#fff' : 'var(--text-mute)';

        }
        styleModeBtns();
        searchRow.appendChild(grepBtn);
        searchRow.appendChild(recallBtn);
        searchSection.appendChild(searchRow);
        var searchHelp = document.createElement('div');
        searchHelp.className = 'ui-orch-modal-help';
        searchHelp.style.marginTop = '0.35rem';
        searchHelp.textContent = 'Find memories steering this agent. “Stored text” greps every layer; “Recall preview” shows what the agent actually sees for a query — the problem memory is usually the top hit.';
        searchSection.appendChild(searchHelp);
        var searchResults = document.createElement('div');
        searchResults.className = 'ui-orch-scrolllist';
        searchResults.style.cssText = 'margin-top:0.5rem;display:none;max-height:16rem';
        searchSection.appendChild(searchResults);
        m.body.appendChild(searchSection);

        function layerChip(layer) {
          var colors = { pinned: '#6366f1', finding: '#0ea5e9', knowledge: '#10b981', history: '#a855f7', cortex: '#f59e0b', notes: '#64748b' };
          var c = document.createElement('span');
          c.textContent = layer;
          c.style.cssText = 'display:inline-block;font-size:0.66rem;text-transform:uppercase;letter-spacing:0.04em;padding:0.05rem 0.4rem;border-radius:3px;color:#fff;flex:0 0 auto;background:' + (colors[layer] || '#64748b');
          return c;
        }
        function renderMemSearch(d) {
          searchResults.innerHTML = '';
          searchResults.style.display = '';
          var items = (d && d.items) || [];
          if (!items.length) {
            var empty = document.createElement('div');
            empty.style.cssText = 'color:var(--text-mute);font-style:italic;font-size:0.82rem;padding:0.3rem 0;white-space:pre-wrap';
            empty.textContent = (d && d.note) ? d.note : 'No matches.';
            searchResults.appendChild(empty);
            return;
          }
          items.forEach(function(item) {
            var row = document.createElement('div');
            row.style.cssText = 'display:flex;gap:0.5rem;align-items:flex-start;padding:0.4rem 0;border-bottom:1px solid var(--border)';

            if (item.deletable && item.id) {

              del.textContent = String.fromCharCode(215);
              del.title = 'Delete this memory (' + item.id + ')';
              del.onclick = async function() {
                if (!(await window.uiConfirm('Delete this ' + item.layer + ' memory?\n\n' + (item.text || item.title || item.id).slice(0, 200)))) return;
                fetch(memsearchURL + '?id=' + encodeURIComponent(item.id), {method: 'DELETE'})
                  .then(function(r) { if (!r.ok && r.status !== 204) throw new Error('HTTP ' + r.status); row.remove(); })
                  .catch(function(err) { window.uiAlert('Delete failed: ' + (err && err.message || err)); });
              };
              row.appendChild(del);
            }
            searchResults.appendChild(row);
          });
        }
        var memSearchBusy = false;
        function runMemSearch() {
          var q = searchInput.value.trim();
          if (!q || memSearchBusy) return;
          memSearchBusy = true;
          searchResults.style.display = '';
          searchResults.innerHTML = '<div style="color:var(--text-mute);font-style:italic;font-size:0.82rem;padding:0.3rem 0">Searching…</div>';

            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

          var addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'ui-orch-list-add';

          factsList.appendChild(addBtn);
        }
        renderFacts();

        fetch(factsURL).then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){

            facts = (d.notes || []).slice();

        function renderInferred(items) {

            topicCaret.textContent = String.fromCharCode(9656); // ▸

            body.appendChild(topic);
            var content = document.createElement('div');
            content.style.cssText = 'white-space:pre-wrap;margin-top:0.15rem;display:none';
            content.textContent = item.content || '';
            body.appendChild(content);
            topic.addEventListener('click', function() {

            var del = document.createElement('button');
            del.className = 'ui-orch-list-del';

            del.textContent = String.fromCharCode(215);
            del.title = 'Delete this entry';
            del.onclick = async function() {
              if (!(await window.uiConfirm('Delete this Reference Memory entry?'))) return;
              fetch(inferredURL + '/' + encodeURIComponent(item.id), {method: 'DELETE'})
                .then(function(r) {
                  if (!r.ok && r.status !== 204) throw new Error('HTTP ' + r.status);

            row.appendChild(body);
            row.appendChild(del);
            inferredList.appendChild(row);

        fetch(inferredURL)
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){ renderInferred(d ? d.items : []); })
          .catch(function(){ renderInferred([]); });

        // --- Graph Memory section ---

        var graphURL = 'api/agents/' + encodeURIComponent(id) + '/graph';
        var graphSection = document.createElement('div');

        graphSection.style.paddingTop = '0.8rem';

        var graphHelp = document.createElement('div');
        graphHelp.className = 'ui-orch-modal-help';
        graphHelp.style.marginBottom = '0.5rem';
        graphHelp.textContent = 'Entities and relationships the agent recorded via link_entities, looked up on demand with recall_about. Delete an entity (with its links) or a single relationship to prune.';
        graphSection.appendChild(graphHelp);
        var graphList = document.createElement('div');
        graphList.className = 'ui-orch-list';
        graphSection.appendChild(graphList);
        m.body.appendChild(graphSection);

        function renderGraph(data) {
          graphList.innerHTML = '';
          var ents = (data && data.entities) || [];
          var counts = (data && data.counts) || {};
          if (counts.entities != null) {
            graphTitle.textContent = 'Graph Memory (' + counts.entities + ' entit' + (counts.entities === 1 ? 'y' : 'ies') + ', ' + (counts.edges || 0) + ' link' + (counts.edges === 1 ? '' : 's') + ')';
          }
          if (!ents.length) {
            var empty = document.createElement('div');
            empty.style.cssText = 'color:var(--text-mute);font-style:italic;padding:0.4rem 0';
            empty.textContent = 'No graph entries yet. Relationships the agent records with link_entities will appear here.';
            graphList.appendChild(empty);
            return;
          }
          ents.forEach(function(e) {
            var row = document.createElement('div');
            row.className = 'ui-orch-list-row';
            row.style.alignItems = 'flex-start';
            var body = document.createElement('div');
            body.style.cssText = 'flex:1;font-size:0.85rem;line-height:1.4';
            var head = document.createElement('div');
            var nm = document.createElement('span');
            nm.style.fontWeight = '600';
            nm.textContent = e.name;
            head.appendChild(nm);
            if (e.kind) {
              var kd = document.createElement('span');
              kd.style.cssText = 'color:var(--text-mute);font-size:0.74rem;margin-left:0.35rem';
              kd.textContent = '(' + e.kind + ')';
              head.appendChild(kd);
            }
            body.appendChild(head);
            if (e.aliases && e.aliases.length) {
              var al = document.createElement('div');
              al.style.cssText = 'color:var(--text-mute);font-size:0.72rem;display:flex;flex-wrap:wrap;gap:0.3rem;align-items:center';
              al.appendChild(document.createTextNode('aka'));
              e.aliases.forEach(function(a) {
                var chip = document.createElement('span');
                chip.style.cssText = 'display:inline-flex;align-items:center;gap:0.2rem';
                chip.appendChild(document.createTextNode(a));
                var adel = document.createElement('span');
                adel.style.cssText = 'cursor:pointer;font-size:0.75rem';
                adel.textContent = String.fromCharCode(215);
                adel.title = 'Remove alias';
                adel.onclick = async function() {
                  if (!(await window.uiConfirm('Remove alias "' + a + '" from ' + e.name + '?'))) return;
                  fetch(graphURL + '/entity/' + encodeURIComponent(e.id) + '/alias?value=' + encodeURIComponent(a), {method: 'DELETE'})
                    .then(function(r) { if (!r.ok && r.status !== 204) throw new Error('HTTP ' + r.status); chip.remove(); })
                    .catch(function(err) { window.uiAlert('Delete failed: ' + (err && err.message || err)); });
                };
                chip.appendChild(adel);
                al.appendChild(chip);
              });
              body.appendChild(al);
            }
            if (e.attrs) {
              Object.keys(e.attrs).sort().forEach(function(k) {
                var at = document.createElement('div');
                at.style.cssText = 'display:flex;align-items:center;gap:0.35rem;color:var(--text-mute);font-size:0.74rem';
                var atl = document.createElement('span');
                atl.textContent = k + ': ' + e.attrs[k];
                at.appendChild(atl);
                var atdel = document.createElement('span');
                atdel.style.cssText = 'cursor:pointer;font-size:0.8rem';
                atdel.textContent = String.fromCharCode(215);
                atdel.title = 'Remove this attribute';
                atdel.onclick = async function() {
                  if (!(await window.uiConfirm('Remove "' + k + '" from ' + e.name + '?'))) return;
                  fetch(graphURL + '/entity/' + encodeURIComponent(e.id) + '/attr?key=' + encodeURIComponent(k), {method: 'DELETE'})
                    .then(function(r) { if (!r.ok && r.status !== 204) throw new Error('HTTP ' + r.status); at.remove(); })
                    .catch(function(err) { window.uiAlert('Delete failed: ' + (err && err.message || err)); });
                };
                at.appendChild(atdel);
                body.appendChild(at);
              });
            }
            (e.edges || []).forEach(function(ed) {
              var er = document.createElement('div');
              er.style.cssText = 'display:flex;align-items:center;gap:0.35rem;margin-top:0.15rem';
              var lbl = document.createElement('span');
              lbl.style.fontSize = '0.8rem';
              lbl.textContent = String.fromCharCode(8594) + ' ' + ed.rel + ' ' + String.fromCharCode(8594) + ' ' + (ed.to_name || ed.to) + (ed.note ? ' (' + ed.note + ')' : '');
              er.appendChild(lbl);
              var edel = document.createElement('span');
              edel.style.cssText = 'cursor:pointer;color:var(--text-mute);font-size:0.8rem';
              edel.textContent = String.fromCharCode(215);
              edel.title = 'Remove this relationship';
              edel.onclick = async function() {
                if (!(await window.uiConfirm('Remove the relationship: ' + e.name + ' ' + ed.rel + ' ' + (ed.to_name || ed.to) + '?'))) return;
                var u = graphURL + '/edge?from=' + encodeURIComponent(e.id) + '&rel=' + encodeURIComponent(ed.rel) + '&to=' + encodeURIComponent(ed.to);
                fetch(u, {method: 'DELETE'})
                  .then(function(r) { if (!r.ok && r.status !== 204) throw new Error('HTTP ' + r.status); er.remove(); })
                  .catch(function(err) { window.uiAlert('Delete failed: ' + (err && err.message || err)); });
              };
              er.appendChild(edel);
              body.appendChild(er);
            });
            var del = document.createElement('button');
            del.className = 'ui-orch-list-del';
            del.type = 'button';
            del.textContent = String.fromCharCode(215);
            del.title = 'Delete this entity and all its relationships';
            del.onclick = async function() {
              if (!(await window.uiConfirm('Delete ' + e.name + ' and all its relationships?'))) return;
              fetch(graphURL + '/entity/' + encodeURIComponent(e.id), {method: 'DELETE'})
                .then(function(r) { if (!r.ok && r.status !== 204) throw new Error('HTTP ' + r.status); row.remove(); })
                .catch(function(err) { window.uiAlert('Delete failed: ' + (err && err.message || err)); });

            row.appendChild(body);
            row.appendChild(del);

        fetch(graphURL)
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){ renderGraph(d || {}); })
          .catch(function(){ renderGraph({}); });

        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'ui-orch-modal-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = m.close;
        var saveBtn = document.createElement('button');
        saveBtn.className = 'ui-orch-modal-btn primary';
        saveBtn.textContent = 'Save';
        saveBtn.onclick = function() {
          var cleanFacts = facts.map(function(n) { return n.trim(); })
                                .filter(function(n) { return n.length > 0; });
          saveBtn.disabled = true;
          fetch(factsURL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({notes: cleanFacts}),
          }).then(function(r) {
            if (!r.ok && r.status !== 204) {
              return r.text().then(function(t) { throw new Error(t); });
            }
            m.close();
            refreshAgentCounts();
          }).catch(function(err) {
            saveBtn.disabled = false;
            window.uiAlert('Save failed: ' + (err && err.message || err));
          });
        };
        m.footer.appendChild(cancelBtn);
        m.footer.appendChild(saveBtn);
      });

      window.uiRegisterClientAction('orchestrate_knowledge_modal', function() {
        var id = getAgentID();
        if (!id) { window.uiAlert('Pick an agent first.'); return; }
        var privateURL = 'api/agents/' + encodeURIComponent(id) + '/knowledge/sources';
        var privateUploadURL = 'api/agents/' + encodeURIComponent(id) + '/knowledge/upload';
        var corpusURL = 'api/agents/' + encodeURIComponent(id) + '/knowledge';
        var autoWipeURL = 'api/agents/' + encodeURIComponent(id) + '/knowledge/auto-inferred';
        var m = openOrchModal('Knowledge');
        var body = m.body;
        var help = document.createElement('div');
        help.className = 'ui-orch-modal-help';
        help.textContent = 'Documents this agent can search. Upload private files below, or attach shared Collections.';
        body.appendChild(help);

        // Helper: build an upload + sources subsection bound to a pair of URLs.
        function buildSection(title, subHelp, listURL, uploadURL, deleteScope) {
          var wrap = document.createElement('div');
          var t = document.createElement('div');
          t.style.cssText = 'font-weight:600;color:var(--text);margin-bottom:0.3rem';
          t.textContent = title;
          wrap.appendChild(t);
          var sh = document.createElement('div');
          sh.style.cssText = 'font-size:0.74rem;color:var(--text-mute);line-height:1.45;margin-bottom:0.5rem';
          sh.textContent = subHelp;
          wrap.appendChild(sh);
          var upRow = document.createElement('div');
          upRow.style.cssText = 'display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap';
          var upInp = document.createElement('input'); upInp.type = 'file';
          // Kept in step with core/media/document_extract.go's switch — a picker
          // narrower than the extractor makes a supported format look unsupported,
          // and the user has no way to tell which end refused them.
          upInp.accept = '.pdf,.docx,.doc,.txt,.md,.log,.csv,.json,.yaml,.yml,.html,.htm,'
            + 'application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,'
            + 'application/json,text/plain,text/markdown,text/csv,text/html';
          upInp.style.cssText = 'flex:1;min-width:0;font-size:0.8rem';
          var upBtn = document.createElement('button'); upBtn.type = 'button'; upBtn.className = 'ui-row-btn primary';
          upBtn.style.cssText = 'padding:0.3rem 0.7rem;font-size:0.8rem';
          upBtn.textContent = 'Upload';
          upBtn.disabled = true;
          upInp.addEventListener('change', function(){ upBtn.disabled = !(upInp.files && upInp.files[0]); });
          var upStatus = document.createElement('span');
          upStatus.style.cssText = 'font-size:0.72rem;color:var(--text-mute)';
          upRow.appendChild(upInp); upRow.appendChild(upBtn); upRow.appendChild(upStatus);
          wrap.appendChild(upRow);
          var list = document.createElement('div');
          list.style.cssText = 'display:flex;flex-direction:column;gap:0.3rem';
          wrap.appendChild(list);
          function refresh() {
            fetch(listURL).then(function(r){ return r.ok ? r.json() : null; }).then(function(d) {
              list.innerHTML = '';
              var sources = (d && d.sources) || [];
              if (sources.length === 0) {
                var emp = document.createElement('div');
                emp.style.cssText = 'font-size:0.74rem;color:var(--text-mute);font-style:italic';
                emp.textContent = '(no documents yet)';
                list.appendChild(emp);
                return;
              }
              sources.forEach(function(s) {
                var row = document.createElement('div');
                row.style.cssText = 'display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0.5rem;background:var(--bg-0);border:1px solid var(--border);border-radius:4px;font-size:0.8rem';
                var nm = document.createElement('span');
                nm.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
                nm.textContent = (s.name || s.id || '(unnamed)').replace(/^#+\s*/, '');
                nm.title = nm.textContent;
                var meta = document.createElement('span');
                meta.style.cssText = 'color:var(--text-mute);font-size:0.7rem';
                meta.textContent = (s.chunks || 0) + ' chunk' + (s.chunks === 1 ? '' : 's');
                var del = document.createElement('button'); del.type = 'button'; del.className = 'ui-row-btn';
                del.style.cssText = 'color:var(--danger,#ff7b72);font-size:0.74rem;padding:0.2rem 0.5rem';
                del.textContent = 'Remove';
                del.onclick = async function() {
                  if (!(await window.uiConfirm('Remove ' + nm.textContent + ' from ' + deleteScope + '?'))) return;
                  del.disabled = true;
                  fetch(listURL + '/' + encodeURIComponent(s.id), {method: 'DELETE'})
                    .then(function(r){ if (!r.ok) return r.text().then(function(t){ throw new Error(t); }); refresh(); })
                    .catch(function(err){ del.disabled = false; window.uiAlert('Remove failed: ' + (err && err.message || err)); });
                };
                row.appendChild(nm); row.appendChild(meta); row.appendChild(del);
                list.appendChild(row);
              });
            });
          }
          refresh();
          upBtn.onclick = function() {
            var f = upInp.files && upInp.files[0];
            if (!f) return;
            upBtn.disabled = true;
            upStatus.style.color = 'var(--text-mute)';
            upStatus.textContent = 'Extracting + indexing...';
            var reader = new FileReader();
            reader.onload = function() {
              var s = reader.result || '';
              var comma = s.indexOf(',');
              var b64 = comma >= 0 ? s.substring(comma + 1) : s;
              fetch(uploadURL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: f.name, mime_type: f.type || '', data: b64}),
              }).then(function(r){
                if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
                return r.json();
              }).then(function(out) {
                upStatus.style.color = 'var(--accent,#56d364)';
                upStatus.textContent = 'Added ' + (out.chunks || 0) + ' chunks';
                upInp.value = '';
                refresh();
              }).catch(function(err){
                upStatus.style.color = 'var(--danger,#ff7b72)';
                upStatus.textContent = 'Upload failed: ' + (err && err.message || err);
                upBtn.disabled = false;
              });
            };
            reader.readAsDataURL(f);
          };
          return wrap;
        }

        body.appendChild(buildSection(
          'Your private documents',
          'Files YOU uploaded under this agent. Scoped to your account — other users on the same agent don\'t see them.',
          privateURL, privateUploadURL,
          'your documents'
        ));

        // --- Attached collections (curation) -----------------------
        // Lets the user attach/detach reusable Collections inline
        // without going back to the editor. Toggling a row commits
        // immediately via POST /api/agents (merge semantics on the
        // attached_collections field).
        var collectionsWrap = document.createElement('div');
        collectionsWrap.style.cssText = 'padding-top:0.8rem;margin-top:0.4rem;border-top:1px solid var(--border)';
        var ch = document.createElement('div');
        ch.style.cssText = 'font-weight:600;color:var(--text);margin-bottom:0.3rem';
        ch.textContent = 'Attached collections';
        collectionsWrap.appendChild(ch);
        var chHelp = document.createElement('div');
        chHelp.style.cssText = 'font-size:0.74rem;color:var(--text-mute);line-height:1.45;margin-bottom:0.5rem';
        chHelp.textContent = 'Reusable collections searched alongside this agent\'s own documents. Toggle to attach or detach.';
        collectionsWrap.appendChild(chHelp);
        var collectionsList = document.createElement('div');
        collectionsList.style.cssText = 'display:flex;flex-direction:column;gap:0.3rem';
        collectionsWrap.appendChild(collectionsList);

        // Scaffold-from-agent action — creates an empty collection
        // named "<agent> Knowledge" with the agent's description
        // copied in, attaches it. One-click "give this agent a place
        // to put its docs" for the common case where the user just
        // built the agent and wants to start uploading material.
        var scaffoldRow = document.createElement('div');
        scaffoldRow.style.cssText = 'display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem';
        var scaffoldBtn = document.createElement('button');
        scaffoldBtn.type = 'button';
        scaffoldBtn.className = 'ui-row-btn';
        scaffoldBtn.style.cssText = 'padding:0.3rem 0.7rem;font-size:0.8rem';
        scaffoldBtn.textContent = '+ Create knowledge for this agent';
        scaffoldBtn.title = 'Create an empty collection named after this agent and attach it. Upload docs to fill it, or rename later under Knowledge.';
        var scaffoldStatus = document.createElement('span');
        scaffoldStatus.style.cssText = 'font-size:0.72rem;color:var(--text-mute)';
        scaffoldRow.appendChild(scaffoldBtn);
        scaffoldRow.appendChild(scaffoldStatus);
        collectionsWrap.appendChild(scaffoldRow);

        body.appendChild(collectionsWrap);

        // Shared core/ui picker (attach mode) against the agent record:
        // GET api/agents/<id> for the current attachment, full-record POST
        // back to api/agents on every add/remove.
        var pickerCfg = {
          type: 'chip_picker', mode: 'attach',
          options_source: 'api/collections',
          record_source: 'api/agents/' + encodeURIComponent(id),
          field: 'attached_collections',
          post_to: 'api/agents',
          name_field: 'id', label_field: 'name', desc_field: 'description',
          meta_fields: ['documents', 'chunks'],
          noun: 'Knowledge',
          empty_text: '(no collections yet — use + Create knowledge for this agent, or author one under Knowledge)'
        };
        function renderCollections() { collectionsList.innerHTML = ''; window.uiMountComponent(pickerCfg, collectionsList); }
        renderCollections();

        scaffoldBtn.onclick = function() {
          scaffoldBtn.disabled = true;
          scaffoldStatus.style.color = 'var(--text-mute)';
          scaffoldStatus.textContent = 'Creating…';
          fetch('api/agents/' + encodeURIComponent(id) + '/knowledge/scaffold-collection', {method: 'POST'})
            .then(function(r){ if (!r.ok) return r.text().then(function(t){ throw new Error(t); }); return r.json(); })
            .then(function(out) {
              scaffoldStatus.style.color = 'var(--accent,#56d364)';
              scaffoldStatus.textContent = 'Created "' + (out.name || 'collection') + '"';
              renderCollections();
            })
            .catch(function(err){
              scaffoldStatus.style.color = 'var(--danger,#ff7b72)';
              scaffoldStatus.textContent = 'Failed: ' + (err && err.message || err);
            })
            .finally(function(){ scaffoldBtn.disabled = false; });
        };
      });

      // --- Pipelines modal -------------------------------------------
      // Attach saved pipelines to this agent. Each toggled-on pipeline
      // becomes a callable run_<pipeline> tool on the agent (see
      // buildAttachedPipelineToolDefs). Reuses the generic allowlist
      // picker against /api/pipelines + the attached_pipelines field;
      // toggling commits immediately via the full-record POST.
      window.uiRegisterClientAction('orchestrate_pipelines_modal', function() {
        var id = getAgentID();
        if (!id) { window.uiAlert('Pick an agent first.'); return; }
        var m = openOrchModal('Pipelines');
        var body = m.body;
        var help = document.createElement('div');
        help.className = 'ui-orch-modal-help';
        help.textContent = 'Attach saved multi-stage pipelines to this agent. Each attached pipeline becomes a callable tool (run_<pipeline>) the agent can run on demand. Author pipelines from chat with the pipeline tool.';
        body.appendChild(help);

        var pipesWrap = document.createElement('div');
        var ph = document.createElement('div');
        ph.style.cssText = 'font-weight:600;color:var(--text);margin-bottom:0.3rem';
        ph.textContent = 'Attached pipelines';
        pipesWrap.appendChild(ph);
        var pHelp = document.createElement('div');
        pHelp.style.cssText = 'font-size:0.74rem;color:var(--text-mute);line-height:1.45;margin-bottom:0.5rem';
        pHelp.textContent = 'Toggle to attach or detach. Attached pipelines run synchronously and return their final stage output to the agent.';
        pipesWrap.appendChild(pHelp);
        var pipesList = document.createElement('div');
        pipesList.style.cssText = 'display:flex;flex-direction:column;gap:0.3rem';
        pipesWrap.appendChild(pipesList);
        body.appendChild(pipesWrap);

        window.uiMountComponent({
          type: 'chip_picker', mode: 'attach',
          options_source: 'api/pipelines',
          record_source: 'api/agents/' + encodeURIComponent(id),
          field: 'attached_pipelines',
          post_to: 'api/agents',
          name_field: 'id', label_field: 'name', desc_field: 'description',
          noun: 'Pipeline',
          empty_text: '(no pipelines yet — author one from chat with the pipeline tool)'
        }, pipesList);
      });

      // --- Sources modal ---------------------------------------------
      // Cross-app reference sources: file stores, servitor systems,
      // connected document services. Each attachment mints its OWN named
      // tools on the agent (search_<name>_knowledge, investigate_<name>,
      // a file store's search/read pair), which is why the option rows
      // name them — an attachment whose tools you cannot see is
      // indistinguishable from one that did not take.
      //
      // Dedicated-endpoint picker mode (attached_field + save_key): the
      // agent record stores {kind,item_id} objects and this component
      // submits a flat list, so /api/reference-sources does the
      // translation rather than the shared component learning the shape.
      window.uiRegisterClientAction('orchestrate_sources_modal', function() {
        var id = getAgentID();
        if (!id) { window.uiAlert('Pick an agent first.'); return; }
        var qp = 'agent=' + encodeURIComponent(id);
        var m = openOrchModal('Sources');
        var body = m.body;
        var help = document.createElement('div');
        help.className = 'ui-orch-modal-help';
        help.textContent = 'What this agent can reach into. Attaching a source adds its own named tools to the agent — the "Adds:" line on each row is exactly what appears in its catalog, so you can ask for it by name.';
        body.appendChild(help);

        var list = document.createElement('div');
        list.style.cssText = 'display:flex;flex-direction:column;gap:0.3rem';
        body.appendChild(list);

        window.uiMountComponent({
          type: 'chip_picker', mode: 'attach',
          options_source: 'api/reference-sources?' + qp,
          records_field: 'items',
          attached_field: 'attached',
          save_key: 'references',
          post_to: 'api/reference-sources?' + qp,
          name_field: 'id', label_field: 'name', desc_field: 'desc',
          group_by_field: 'group',
          noun: 'Source',
          empty_text: '(nothing to attach yet — file stores are assigned by an admin under Admin \u2192 Files, systems appear once you have appliances in servitor, and document services once connected)'
        }, list);

        // The same question from the SOURCE's side: which of my agents is
        // this linked to. The picker above answers it for the open agent
        // only, and checking four agents one at a time is how you come to
        // believe an attachment took when it did not.
        //
        // Same pill control, same endpoint, as the Tools modal's Scope
        // button — kind=source is the only difference (see
        // admin_source_scope.go). No Global pill: a source has no
        // user-wide scope, and the renderer simply omits the primary when
        // load() returns none.
        var linkWrap = document.createElement('div');
        linkWrap.style.cssText = 'margin-top:0.9rem;padding-top:0.7rem;border-top:1px solid var(--border,#3a3a4a)';
        var linkBtn = document.createElement('button');
        linkBtn.className = 'ui-row-btn';
        linkBtn.style.cssText = 'font-size:0.78rem;padding:0.25rem 0.55rem';
        linkBtn.textContent = 'Linked agents…';
        linkBtn.title = 'See and change which of your agents each source is linked to';
        linkWrap.appendChild(linkBtn);
        body.appendChild(linkWrap);

        linkBtn.addEventListener('click', function() {
          fetch('api/reference-sources?' + qp, {cache: 'no-store'})
            .then(function(r){ return r.ok ? r.json() : {items: []}; })
            .then(function(d) {
              var items = (d && d.items) || [];
              if (!items.length) { window.uiAlert('There are no sources to link.'); return; }
              window.uiOpenSimpleModal({title: 'Linked agents', width: '560px', mount: function(mbody){
                var pick = document.createElement('select');
                pick.style.cssText = 'width:100%;margin-bottom:0.7rem;padding:0.35rem';
                items.forEach(function(it){
                  var o = document.createElement('option');
                  o.value = it.id;
                  o.textContent = (it.group ? it.group + ' — ' : '') + (it.name || it.id);
                  pick.appendChild(o);
                });
                mbody.appendChild(pick);
                var host = document.createElement('div');
                mbody.appendChild(host);
                function draw() {
                  var qs = 'name=' + encodeURIComponent(pick.value) + '&kind=source';
                  host.innerHTML = '';
                  window.uiRenderScopePills(host, {
                    load: function(){
                      return fetch('api/tool-scope?' + qs, {cache:'no-store'}).then(function(res){
                        if(!res.ok) return res.text().then(function(x){ throw new Error(x || ('HTTP ' + res.status)); });
                        return res.json();
                      }).then(function(st){
                        return {
                          items: (st.agents || []).map(function(a){ return {key: a.id, label: a.name, on: !!a.on}; }),
                          note: 'Linked only to the agents shown. Each one gets this source\u2019s own tools; the rest cannot reach it at all. There is no all-agents option on purpose \u2014 a folder of logs is not something to grant everywhere in one click.'
                        };
                      });
                    },
                    toggle: function(key, on){
                      return fetch('api/tool-scope?' + qs, {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({target: key, on: on})
                      }).then(function(res){
                        if(!res.ok) return res.text().then(function(x){ throw new Error(x || ('HTTP ' + res.status)); });
                      });
                    }
                  });
                }
                pick.addEventListener('change', draw);
                draw();
              }});
            });
        });
      });

      // --- Machines modal --------------------------------------------
      // Phase machines (docs/agent-machines.md). Single-select, unlike
      // Pipelines: an agent runs at most ONE machine, so this is a radio
      // list rather than the chip_picker's toggle set.
      window.uiRegisterClientAction('orchestrate_machines_modal', function(ctx) {
        var id = getAgentID();
        if (!id) { window.uiAlert('Pick an agent first.'); return; }
        // The open session, when there is one. Its machine's diagram is
        // then drawn with the overlay — where this conversation is
        // sitting and which edges it has actually taken — which is the
        // whole reason the picture beats the list of phase names.
        var activeSid = (ctx && ctx.sessionId) || '';
        Promise.all([
          fetch('api/machines').then(function(r) { return r.ok ? r.json() : {machines: []}; }),
          fetchAgent(id)
        ]).then(function(res) {
          var machines = (res[0] && res[0].machines) || [];
          var agent = res[1] || {};
          var m = openOrchModal('Machines — ' + (agent.name || id));
          var help = document.createElement('div');
          help.className = 'ui-orch-modal-help';
          help.textContent = 'A phase machine gives this agent a workflow it moves through and STAYS in: it works out what is being asked once, picks an approach once, then answers in that frame for the rest of the thread instead of re-deciding every turn. The agent keeps its persona — the machine supplies procedure. Author machines from chat with the machine tool.';
          m.body.appendChild(help);

          var picked = agent.machine || '';

          // Above the list: this acts on the COLLECTION, while the
          // footer's Save acts on the agent. Two different subjects, so
          // two different places.
          var newBtn = document.createElement('button');
          newBtn.className = 'ui-orch-modal-btn';
          newBtn.type = 'button';
          newBtn.textContent = 'New machine';
          newBtn.style.cssText = 'margin-bottom:0.6rem';
          newBtn.onclick = function() { m.close(); openMachineEditor('', ''); };
          m.body.appendChild(newBtn);

          var list = document.createElement('div');
          list.style.cssText = 'display:flex;flex-direction:column;gap:0.35rem';
          m.body.appendChild(list);

          if (!machines.length) {
            var empty = document.createElement('div');
            empty.style.cssText = 'color:var(--text-mute);font-size:0.82rem;line-height:1.5';
            empty.textContent = 'No machines yet. New machine above starts from a working example you can edit, or ask Builder for one — say what the conversation should work out first and what it should settle into doing, and it can attach the result to this agent in the same step.';
            list.appendChild(empty);
          }

          // Every row is one radio option; "None" is first so there is
          // always a way back to a plain agent.
          function row(value, title, subtitle, meta) {
            var wrap = document.createElement('label');
            wrap.style.cssText = 'display:flex;gap:0.55rem;align-items:flex-start;padding:0.5rem 0.6rem;border:1px solid var(--border);border-radius:6px;cursor:pointer';
            var radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'orch-machine-pick';
            radio.value = value;
            radio.checked = (picked === value);
            radio.style.cssText = 'margin-top:0.2rem;flex:0 0 auto';
            radio.addEventListener('change', function() { if (radio.checked) picked = value; });
            wrap.appendChild(radio);
            var text = document.createElement('div');
            text.style.cssText = 'flex:1 1 auto;min-width:0';
            var t = document.createElement('div');
            t.style.cssText = 'font-weight:600;color:var(--text);font-size:0.86rem';
            t.textContent = title;
            text.appendChild(t);
            if (subtitle) {
              var sub = document.createElement('div');
              sub.style.cssText = 'color:var(--text-mute);font-size:0.76rem;line-height:1.45;margin-top:0.1rem';
              sub.textContent = subtitle;
              text.appendChild(sub);
            }
            if (meta) {
              var mt = document.createElement('div');
              mt.style.cssText = 'color:var(--text-mute);font-size:0.72rem;line-height:1.45;margin-top:0.2rem';
              mt.textContent = meta;
              text.appendChild(mt);
            }
            wrap.appendChild(text);
            return wrap;
          }

          list.appendChild(row('', 'None', 'The persona governs every turn — the agent decides its approach fresh each time.', ''));

          machines.forEach(function(mc) {
            var names = (mc.phase_names || []).join(' → ');
            var meta = names ? ('Phases: ' + names + '. Starts in ' + (mc.start || '?') + '.') : '';
            if (mc.used_by && mc.used_by.length) {
              meta += ' Used by: ' + mc.used_by.join(', ') + '.';
            } else {
              meta += ' Not attached to any agent.';
            }
            var r = row(mc.id, mc.name, mc.description || '', meta);
            // The picture. A list of phase names implies an order a
            // machine does not have — guards go backward, routers go
            // sideways, resident phases loop. Fetched as text and
            // injected inline (rather than an <img>) so the page's CSS
            // variables theme it; the server escapes every dynamic
            // string in the document for exactly that reason.
            var figWrap = document.createElement('div');
            figWrap.style.cssText = 'margin-top:0.5rem;overflow-x:auto;max-width:100%';
            var figToggle = document.createElement('button');
            figToggle.className = 'ui-orch-modal-btn';
            figToggle.type = 'button';
            figToggle.textContent = 'Show diagram';
            figToggle.style.cssText = 'font-size:0.72rem;padding:0.15rem 0.5rem;margin-top:0.4rem';
            var shown = false;
            figToggle.onclick = function(ev) {
              ev.preventDefault();
              ev.stopPropagation();
              shown = !shown;
              figToggle.textContent = shown ? 'Hide diagram' : 'Show diagram';
              if (!shown) { figWrap.innerHTML = ''; return; }
              var gURL = 'api/machines/' + encodeURIComponent(mc.id) + '/graph';
              if (activeSid && agent.machine === mc.id) {
                gURL += '?agent=' + encodeURIComponent(id) + '&session=' + encodeURIComponent(activeSid);
              }
              fetch(gURL)
                .then(function(resp) { return resp.ok ? resp.text() : ''; })
                .then(function(svg) {
                  figWrap.innerHTML = svg || '';
                  if (activeSid && agent.machine === mc.id) {
                    var live = document.createElement('div');
                    live.style.cssText = 'color:var(--accent,#6366f1);font-size:0.7rem;margin-top:0.3rem';
                    live.textContent = 'Highlighted: where this conversation is now, and the transitions it has taken.';
                    figWrap.appendChild(live);
                  }
                  if (mc.legend && mc.legend.length) {
                    var lg = document.createElement('div');
                    lg.style.cssText = 'color:var(--text-mute);font-size:0.7rem;line-height:1.5;margin-top:0.3rem';
                    lg.textContent = mc.legend.join(' ');
                    figWrap.appendChild(lg);
                  }
                })
                .catch(function() { figWrap.textContent = 'Diagram unavailable.'; });
            };
            // Edit. A machine gets TUNED — guard wording, phase prompts,
            // whether a phase should be resident — which is a different
            // relationship from a pipeline's write-once-and-run. Until
            // there is a per-phase form (which wants a live run and St4
            // behind it first), the definition itself is the editor: the
            // validator reports every problem at once, which is what
            // makes raw JSON survivable.
            var editBtn = document.createElement('button');
            editBtn.className = 'ui-orch-modal-btn';
            editBtn.type = 'button';
            editBtn.textContent = 'Edit';
            editBtn.style.cssText = 'font-size:0.72rem;padding:0.15rem 0.5rem;margin-top:0.4rem;margin-right:0.35rem';
            editBtn.onclick = function(ev) {
              ev.preventDefault();
              ev.stopPropagation();
              m.close();
              openMachineBuilder(mc.id, mc.name);
            };
            r.querySelector('div').appendChild(editBtn);
            r.querySelector('div').appendChild(figToggle);
            r.querySelector('div').appendChild(figWrap);
            // Delete lives on the row rather than in the footer: the
            // footer's Save applies to the AGENT, and one button that
            // sometimes means "save this agent" and sometimes "destroy a
            // machine" is how someone deletes a workflow by accident.
            var del = document.createElement('button');
            del.className = 'ui-orch-list-del';
            del.type = 'button';
            del.textContent = '×';
            del.title = 'Delete this machine everywhere';
            del.style.cssText = 'flex:0 0 auto';
            del.onclick = function(ev) {
              ev.preventDefault();
              ev.stopPropagation();
              var warn = 'Delete the machine "' + mc.name + '"?';
              if (mc.used_by && mc.used_by.length) {
                warn += ' It will be detached from ' + mc.used_by.join(', ') + '.';
              }
              warn += ' Conversations already running it keep their history and continue as ordinary agent turns.';
              Promise.resolve(window.uiConfirm ? window.uiConfirm(warn) : confirm(warn)).then(function(ok) {
                if (!ok) return;
                fetch('api/machines/' + encodeURIComponent(mc.id), {method: 'DELETE'})
                  .then(function(resp) {
                    if (!resp.ok) return resp.text().then(function(t) { throw new Error(t); });
                    m.close();
                    window.UIClientActions['orchestrate_machines_modal']();
                  })
                  .catch(function(err) { window.uiAlert('Delete failed: ' + (err && err.message || err)); });
              });
            };
            r.appendChild(del);
            list.appendChild(r);
          });

          var note = document.createElement('div');
          note.style.cssText = 'color:var(--text-mute);font-size:0.74rem;line-height:1.5;margin-top:0.7rem';
          note.textContent = 'Conversations already open keep the machine they started with — this applies to new sessions.';
          m.body.appendChild(note);

          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'ui-orch-modal-btn';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.onclick = m.close;
          var saveBtn = document.createElement('button');
          saveBtn.className = 'ui-orch-modal-btn primary';
          saveBtn.textContent = 'Save';
          saveBtn.onclick = function() {
            saveBtn.disabled = true;
            // Partial update: this posts ONLY the machine field, so
            // nothing else on the agent can be clobbered by a stale read.
            fetch('api/agents/' + encodeURIComponent(id), {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({machine: picked}),
            }).then(function(resp) {
              if (!resp.ok) return resp.text().then(function(t) { throw new Error(t); });
              m.close();
            }).catch(function(err) {
              saveBtn.disabled = false;
              window.uiAlert('Save failed: ' + (err && err.message || err));
            });
          };
          m.footer.appendChild(cancelBtn);
          m.footer.appendChild(saveBtn);
        }).catch(function(err) {
          window.uiAlert('Could not load machines: ' + (err && err.message || err));
        });
      });

      // openMachineEditor edits one machine's definition as JSON.
      //
      // Deliberately the raw recipe rather than a form: the phase schema
      // is still moving (St4 is allowed to change it), and a form built
      // against a moving schema is the expensive thing to throw away.
      // The server's validator is what makes this usable — it reports
      // every problem in one response instead of one per round trip.
      // The STRUCTURED editor: questions instead of JSON. The spec comes
      // from the server (machine_editor.go) because the selects need the
      // machine's own phase names and declared output fields, and the
      // help text — which is the part that carries the concepts — belongs
      // where it can be reviewed and tested.
      //
      // openMachineEditor (the JSON one, below) stays as the other door:
      // it is what the machine tool writes and the fastest path for
      // somebody who already knows the shape.
      function openMachineBuilder(machineID, machineName) {
        // uiEl is the runtime's element helper. Bound locally because this
        // script block is a different IIFE from the one that aliases it —
        // a bare el() here throws, and it throws inside a click handler,
        // where nobody sees it.
        var el = window.uiEl;
        fetch('api/machines/' + encodeURIComponent(machineID) + '/editor')
          .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function(spec) {
            var m = openOrchModal('Machine — ' + (spec.name || machineName || machineID));
            var checklist = document.createElement('div');
            m.body.appendChild(checklist);

            // What is still missing, from the machine's own Validate. Work
            // remaining, not a refusal: a half-built machine has problems
            // by definition, and an editor that reported them as failure
            // would be arguing with somebody mid-thought.
            function drawChecklist(items) {
              checklist.innerHTML = '';
              if (!items || !items.length) {
                checklist.appendChild(el('div', {
                  class: 'ui-orch-modal-help',
                  style: 'color:var(--accent,#56d364)',
                  text: '✓ This machine is complete — it will run as written.',
                }));
                return;
              }
              var list = el('ul', {style: 'margin:0 0 0.9rem 1.1rem;padding:0;font-size:0.82rem;line-height:1.6'});
              items.forEach(function(p) { list.appendChild(el('li', {text: p})); });
              checklist.appendChild(el('div', {class: 'ui-orch-modal-help'}, [
                el('strong', {text: 'Still to do'}), list,
              ]));
            }
            drawChecklist(spec.checklist);

            (spec.components || []).forEach(function(c) {
              var host = document.createElement('div');
              host.style.marginBottom = '0.9rem';
              m.body.appendChild(host);
              window.uiMountComponent(c, host);
            });

            // Every save returns the fresh checklist, so the list tracks
            // what you just did rather than what was true when it opened.
            // Polled rather than threaded through each component: the
            // components are generic and know nothing about machines, and
            // teaching them would be exactly the leak core/ui forbids.
            var poll = setInterval(function() {
              if (!document.body.contains(checklist)) { clearInterval(poll); return; }
              fetch('api/machines/' + encodeURIComponent(machineID) + '/editor')
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(fresh) { if (fresh) drawChecklist(fresh.checklist); })
                .catch(function() {});
            }, 4000);

            var foot = el('div', {style: 'display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.6rem'}, [
              el('button', {
                class: 'ui-orch-modal-btn',
                text: 'Edit as JSON',
                onclick: function() { clearInterval(poll); m.close(); openMachineEditor(machineID, machineName); },
              }),
              el('button', {
                class: 'ui-orch-modal-btn primary',
                text: 'Done',
                onclick: function() {
                  clearInterval(poll);
                  m.close();
                  window.UIClientActions['orchestrate_machines_modal']();
                },
              }),
            ]);
            m.body.appendChild(foot);
          })
          .catch(function(err) {
            window.uiAlert('Could not open the editor: ' + (err && err.message || err));
          });
      }

      function openMachineEditor(machineID, machineName) {
        var creating = !machineID;
        // The starter comes from the SERVER, not from here. One copy, and
        // a Go test proves it validates — an editor that opens on a
        // definition the server would refuse teaches the wrong lesson
        // about the whole feature in the first ten seconds.
        var loaded = creating
          ? fetch('api/machines?starter=1').then(function(r) { return r.json(); })
          : fetch('api/machines/' + encodeURIComponent(machineID))
              .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
              });
        loaded
          .then(function(def) {
            var m = openOrchModal(creating ? 'New machine' : ('Edit machine — ' + (machineName || machineID)));
            var help = document.createElement('div');
            help.className = 'ui-orch-modal-help';
            help.textContent = (creating ? 'A starting point you can replace entirely. ' : '') +
              'The machine definition. Every phase needs a name and a prompt; at least one must be resident (user turns land there). Transient phases hand off with next or next_from. Ask Builder for machine(action="help") for the full spec — or just describe the change to it instead of editing here.';
            m.body.appendChild(help);

            // Storage metadata is the server's and is overwritten on save,
            // so showing it invites edits that silently do nothing.
            var recipe = {
              name: def.name || '',
              description: def.description || '',
              start: def.start || '',
              phases: def.phases || []
            };

            var errBox = document.createElement('div');
            errBox.style.cssText = 'display:none;white-space:pre-wrap;color:var(--danger,#dc2626);background:var(--danger-soft,rgba(220,38,38,0.08));border:1px solid var(--danger,#dc2626);border-radius:6px;padding:0.5rem 0.6rem;font-size:0.78rem;line-height:1.5;margin-bottom:0.5rem';
            m.body.appendChild(errBox);
            function fail(msg) {
              errBox.textContent = msg;
              errBox.style.display = '';
              errBox.scrollIntoView({behavior: 'smooth', block: 'nearest'});
            }

            var ta = document.createElement('textarea');
            ta.value = JSON.stringify(recipe, null, 2);
            ta.spellcheck = false;
            ta.style.cssText = 'width:100%;min-height:22rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.78rem;line-height:1.5;padding:0.6rem;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);resize:vertical';
            m.body.appendChild(ta);

            function back() { m.close(); window.UIClientActions['orchestrate_machines_modal'](); }

            var cancelBtn = document.createElement('button');
            cancelBtn.className = 'ui-orch-modal-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = back;
            var saveBtn = document.createElement('button');
            saveBtn.className = 'ui-orch-modal-btn primary';
            saveBtn.textContent = 'Save';
            saveBtn.onclick = function() {
              var body;
              try {
                body = JSON.parse(ta.value);
              } catch (err) {
                // Caught here rather than sent, so a stray comma reads as
                // what it is instead of coming back as a generic 400.
                fail('That is not valid JSON: ' + (err && err.message || err));
                return;
              }
              saveBtn.disabled = true;
              errBox.style.display = 'none';
              fetch(creating ? 'api/machines' : 'api/machines/' + encodeURIComponent(machineID), {
                method: creating ? 'POST' : 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body),
              }).then(function(resp) {
                if (!resp.ok) {
                  return resp.text().then(function(t) { throw new Error(t.trim()); });
                }
                back();
              }).catch(function(err) {
                // The edits stay in the box: a rejected save that also
                // threw away the work is how someone stops editing here.
                saveBtn.disabled = false;
                fail(err && err.message || String(err));
              });
            };
            m.footer.appendChild(cancelBtn);
            m.footer.appendChild(saveBtn);
          })
          .catch(function(err) {
            window.uiAlert('Could not load that machine: ' + (err && err.message || err));
          });
      }
