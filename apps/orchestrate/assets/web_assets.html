<style>
/* --- Intent block (per-step phase narration; mirror of
 * servitor_intent). Emitted before each worker step starts. --- */
.ui-orch-intent {
  background: var(--bg-2);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 0.55rem 0.75rem;
  margin: 0.3rem 0;
  align-self: flex-start;
  max-width: 92%;
}
.ui-orch-intent-label {
  font-size: 0.72rem; font-weight: 600;
  color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin-bottom: 0.2rem;
}
.ui-orch-intent-task   { color: var(--text-hi); line-height: 1.4; }
.ui-orch-intent-reason {
  color: var(--text-mute);
  font-size: 0.82rem;
  margin-top: 0.25rem;
  font-style: italic;
}

/* --- Plan checklist (mirror of servitor_plan). One block per round;
 * re-emitted on every step status flip via the same id so the
 * dispatcher routes the repeat through onUpdate and the DOM updates
 * in place. --- */
.ui-orch-plan {
  background: var(--bg-2);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 0.65rem 0.85rem;
  margin: 0.4rem 0;
  align-self: stretch;
  max-width: 100%;
}
.ui-orch-plan-h {
  font-size: 0.78rem; font-weight: 600;
  color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin-bottom: 0.5rem;
}
.ui-orch-plan-steps { list-style: none; padding: 0; margin: 0; }
.ui-orch-plan-step {
  display: grid; grid-template-columns: 1.4em 1fr;
  column-gap: 0.4rem; row-gap: 0.1rem;
  padding: 0.25rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem; line-height: 1.4;
}
.ui-orch-plan-step:last-child { border-bottom: none; }
.ui-orch-plan-mark {
  font-family: monospace; color: var(--text-mute);
  text-align: center; align-self: start;
}
.ui-orch-plan-title { color: var(--text-hi); }
.ui-orch-plan-detail {
  grid-column: 2;
  color: var(--text-mute); font-size: 0.78rem; font-style: italic;
}
.ui-orch-plan-findings {
  grid-column: 2;
  color: var(--text); font-size: 0.82rem;
  background: var(--bg-1); padding: 0.2rem 0.4rem;
  border-left: 2px solid #3fb950;
  border-radius: 0 3px 3px 0;
  margin-top: 0.15rem;
}
.ui-orch-plan-blocked-reason {
  grid-column: 2;
  color: #f85149; font-size: 0.82rem;
}
.ui-orch-plan-step.in_progress .ui-orch-plan-mark { color: var(--accent); }
.ui-orch-plan-step.done        .ui-orch-plan-mark { color: #3fb950; }
.ui-orch-plan-step.blocked     .ui-orch-plan-mark { color: #f85149; }
.ui-orch-plan-step.done .ui-orch-plan-title {
  color: var(--text-mute); text-decoration: line-through;
}

/* --- Interactive ask card (ask_user with options) --- */
.ui-orch-ask {
  background: var(--bg-2);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 0.7rem 0.85rem;
  margin: 0.4rem 0;
  align-self: flex-start;
  max-width: min(38rem, 100%);
}
.ui-orch-ask-q {
  color: var(--text-hi);
  margin-bottom: 0.6rem;
  line-height: 1.4;
}
.ui-orch-ask-opts {
  display: flex; flex-direction: column; gap: 0.3rem;
  margin-bottom: 0.6rem;
}
.ui-orch-ask-opt {
  display: flex; align-items: flex-start; gap: 0.5rem;
  padding: 0.25rem 0.4rem;
  border-radius: 3px;
  cursor: pointer;
}
.ui-orch-ask-opt:hover { background: var(--bg-1); }
.ui-orch-ask-opt input { margin-top: 0.2rem; flex-shrink: 0; }
.ui-orch-ask-opt-lbl { color: var(--text); font-size: 0.88rem; }
.ui-orch-ask-extra-lbl {
  display: block;
  font-size: 0.74rem; color: var(--text-mute);
  margin-bottom: 0.25rem;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.ui-orch-ask-extra {
  width: 100%;
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text); font-family: inherit; font-size: 0.88rem;
  padding: 0.4rem 0.55rem;
  resize: vertical;
  min-height: 2.2rem;
  outline: none;
}
.ui-orch-ask-extra:focus { border-color: var(--accent); }
.ui-orch-ask-actions {
  display: flex; justify-content: flex-end;
  margin-top: 0.5rem;
}
.ui-orch-ask-submit {
  background: var(--accent); color: var(--bg-0);
  border: 1px solid var(--accent);
  padding: 0.35rem 0.9rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.82rem; font-family: inherit;
}
.ui-orch-ask-submit:hover { background: var(--accent-hi, var(--accent)); }
.ui-orch-ask-submit[disabled] { opacity: 0.5; cursor: not-allowed; }
.ui-orch-ask.submitted {
  opacity: 0.85;
}
.ui-orch-ask.submitted .ui-orch-ask-submit,
.ui-orch-ask.submitted .ui-orch-ask-extra-lbl {
  display: none;
}
/* Hide unselected option rows entirely; keep selected rows visible
   with strong styling so the historical view reads as "you picked X". */
.ui-orch-ask.submitted .ui-orch-ask-opt {
  display: none;
}
.ui-orch-ask.submitted .ui-orch-ask-opt.picked {
  display: flex;
  background: var(--bg-1);
  border-left: 3px solid var(--accent);
  font-weight: 600;
  cursor: default;
}
.ui-orch-ask.submitted .ui-orch-ask-opt.picked input {
  display: none;
}
.ui-orch-ask.submitted .ui-orch-ask-opt.picked .ui-orch-ask-opt-lbl::before {
  content: "\2713  "; /* checkmark */
  color: var(--accent);
  font-weight: bold;
}
/* The textarea collapses to a static read-only quote of what the
   user typed (if anything), or hides entirely when empty. */
.ui-orch-ask.submitted .ui-orch-ask-extra {
  border: none;
  background: transparent;
  padding: 0.25rem 0;
  resize: none;
  font-style: italic;
  color: var(--text-mute);
  cursor: default;
}
.ui-orch-ask.submitted .ui-orch-ask-extra.empty {
  display: none;
}
/* connect_required — inline "authorize your account" card. */
.ui-orch-connect {
  display: flex; align-items: center; gap: 0.7rem;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 0.7rem 0.85rem;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.ui-orch-connect-icon { font-size: 1.3rem; line-height: 1; }
.ui-orch-connect-body { flex: 1; min-width: 0; }
.ui-orch-connect-title { font-weight: 600; color: var(--text); }
.ui-orch-connect-sub { font-size: 0.82rem; color: var(--text-mute); margin-top: 0.15rem; }
.ui-orch-connect-btn {
  background: var(--accent); color: var(--bg-0);
  border: 1px solid var(--accent);
  padding: 0.35rem 0.9rem; border-radius: 4px; cursor: pointer;
  font-size: 0.82rem; font-family: inherit; white-space: nowrap;
}
.ui-orch-connect-btn:hover { background: var(--accent-hi, var(--accent)); }
.ui-orch-connect-btn[disabled] { opacity: 0.6; cursor: default; }
.ui-orch-connect.connected { border-color: var(--success); background: color-mix(in srgb, var(--success) 10%, transparent); }
/* privilege_grant — inline "what this agent may now do" card, emitted when an
   authoring tool saves an agent. Same governed records as the Permissions
   pane; this is just where the decision belongs. */
.ui-orch-priv { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 0.7rem 0.85rem; background: var(--bg-1); }
.ui-orch-priv-title { font-weight: 600; color: var(--text); }
.ui-orch-priv-sub { font-size: 0.82rem; color: var(--text-mute); margin-top: 0.15rem; }
.ui-orch-priv-rows { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.ui-orch-priv-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
.ui-orch-priv-name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono, monospace); }
.ui-orch-priv-detail { flex: 1 1 auto; color: var(--text-mute); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ui-orch-priv-fixed { color: var(--text-mute); font-size: 0.78rem; white-space: nowrap; }
.ui-orch-priv-sep { margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
.ui-orch-priv select { font-family: inherit; font-size: 0.8rem; padding: 0.1rem 0.3rem; background: var(--bg-0); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
.ui-orch-priv-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.7rem; }
.ui-orch-priv-note { font-size: 0.78rem; color: var(--text-mute); }
/* Small "answered" footer for clarity. */
.ui-orch-ask.submitted::after {
  content: "\2713 Answered";
  display: block;
  margin-top: 0.5rem;
  font-size: 0.75rem;
  color: var(--text-mute);
}

/* --- Interjection bubble affordances (Edit / Delete; consumed style) --- */
.ui-agent-interjection {
  border-left: 3px solid var(--accent);
  padding-left: 0.5rem;
}
.ui-agent-interjection.consumed {
  border-left-color: #3fb950;
  opacity: 0.85;
}
.ui-agent-interjection.consumed::after {
  content: '✓ delivered';
  display: block;
  font-size: 0.7rem;
  color: #3fb950;
  margin-top: 0.2rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ui-agent-interjection-failed {
  border-left-color: #f85149;
}
.ui-orch-interject-actions {
  display: flex; gap: 0.3rem;
  margin-top: 0.3rem;
}
.ui-orch-interject-btn {
  background: var(--bg-1); border: 1px solid var(--border);
  color: var(--text-mute);
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.72rem;
  font-family: inherit;
}
.ui-orch-interject-btn:hover { color: var(--text-hi); }
.ui-orch-interject-btn.danger:hover { color: #f85149; border-color: #f85149; }
.ui-orch-interject-btn.primary {
  background: var(--accent); color: var(--bg-0); border-color: var(--accent);
}
/* --- Modal for the top-bar Tools / Memory / Rules buttons --- */
.ui-orch-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  padding: 1rem;
}
.ui-orch-modal {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 100%; max-width: 36rem;
  max-height: 90vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.ui-orch-modal-h {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
}
.ui-orch-modal-h-title { font-weight: 600; color: var(--text-hi); }
.ui-orch-modal-h-close {
  background: transparent; border: none; cursor: pointer;
  color: var(--text-mute);
  font-size: 1.4rem; line-height: 1; padding: 0 0.3rem;
}
.ui-orch-modal-h-close:hover { color: var(--text-hi); }
.ui-orch-modal-body {
  padding: 0.8rem 1rem;
  overflow: auto;
  flex: 1 1 auto;
  min-height: 0;
}
.ui-orch-modal-help {
  font-size: 0.78rem; color: var(--text-mute);
  margin-bottom: 0.7rem;
  line-height: 1.45;
}
/* --- Custom tools section in the Tools modal -------------------- */
.ui-orch-custom-tools {
  margin-bottom: 1rem;
  padding: 0.6rem 0.8rem;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.ui-orch-custom-tools-h {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.2rem;
}
.ui-orch-custom-tools-help {
  font-size: 0.72rem;
  color: var(--text-mute);
  margin-bottom: 0.5rem;
}
.ui-orch-custom-tool {
  display: flex;
  gap: 0.55rem;
  align-items: flex-start;
  padding: 0.4rem 0;
  border-top: 1px solid var(--border);
}
.ui-orch-custom-tool:first-of-type {
  border-top: none;
}
.ui-orch-custom-tool-icon {
  flex-shrink: 0;
  font-size: 1rem;
  width: 1.4rem;
  text-align: center;
  padding-top: 0.05rem;
}
.ui-orch-custom-tool-meta {
  flex: 1 1 auto;
  min-width: 0;
}
.ui-orch-custom-tool-name {
  font-family: var(--mono, monospace);
  font-size: 0.85rem;
  color: var(--text);
  font-weight: 600;
}
.ui-orch-custom-tool-desc {
  font-size: 0.78rem;
  color: var(--text);
  margin-top: 0.1rem;
  line-height: 1.4;
}
.ui-orch-custom-tool-summary {
  font-family: var(--mono, monospace);
  font-size: 0.72rem;
  color: var(--text-mute);
  margin-top: 0.2rem;
  white-space: pre-wrap;
  word-break: break-all;
}
/* Scoped-tools group in the Tools modal. It is the first CATEGORY inside the
 * one checklist — no box of its own, no separating margin — so it collapses,
 * indents, and is drilled into exactly like every catalog category under it.
 * Only the names differ: mono, because they are identifiers, not prose. */
.ui-orch-scoped-tools .ui-checklist-name { font-family: var(--mono, monospace); }
/* A category one level down, inside the scoped group. Mixed case and lighter
 * than the ALL-CAPS group headers above it, so depth is legible without a
 * second kind of box: it reads as a sub-heading, not a peer. */
.ui-orch-scoped-sub > .ui-checklist-group-collapsible .ui-checklist-group-name {
  text-transform: none; letter-spacing: 0;
  font-size: 0.74rem; font-weight: 500;
  color: var(--text);
}
.ui-orch-modal-ftr {
  display: flex; gap: 0.5rem; justify-content: flex-end;
  padding: 0.7rem 1rem;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
}
.ui-orch-modal-btn {
  background: var(--bg-1); border: 1px solid var(--border);
  color: var(--text);
  padding: 0.4rem 0.9rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.82rem;
  font-family: inherit;
}
.ui-orch-modal-btn:hover { border-color: var(--accent); color: var(--accent); }
.ui-orch-modal-btn.primary {
  background: var(--accent); color: var(--bg-0); border-color: var(--accent);
}
.ui-orch-modal-btn.primary:hover { background: var(--accent-hi, var(--accent)); }
.ui-orch-modal-btn[disabled] { opacity: 0.6; cursor: not-allowed; }

/* Memory + rules: a list of removable line items inside the modal. */
.ui-orch-list { display: flex; flex-direction: column; gap: 0.35rem; }
/* A capped-height list that scrolls. Two things a bare overflow-y:auto gets
 * wrong once a row carries a right-edge action: the scrollbar lands on top of
 * that action (the delete ×, which sits flush against the edge, becomes hard to
 * hit and easy to miss), and the whole list jumps sideways the moment enough
 * results arrive to overflow. scrollbar-gutter reserves the lane so the width
 * never changes, and the padding keeps the button clear of the bar. */
.ui-orch-scrolllist {
  overflow-y: auto;
  scrollbar-gutter: stable;
  padding-right: 0.45rem;
}
.ui-orch-list-row {
  display: flex; gap: 0.4rem; align-items: flex-start;
  padding: 0.35rem 0.5rem;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 4px;
}
.ui-orch-list-row textarea, .ui-orch-list-row input {
  flex: 1; min-width: 0;
  background: transparent; border: none;
  color: var(--text); font-family: inherit; font-size: 0.85rem;
  outline: none; resize: vertical;
  line-height: 1.4;
}
.ui-orch-list-del {
  background: transparent; border: none; cursor: pointer;
  color: var(--text-mute); padding: 0 0.3rem;
  font-size: 1rem; line-height: 1;
}
.ui-orch-list-del:hover { color: var(--danger); }
.ui-orch-list-add {
  align-self: flex-start;
  background: var(--bg-2); border: 1px dashed var(--border);
  color: var(--text-mute); cursor: pointer;
  padding: 0.3rem 0.7rem; border-radius: 4px;
  font-size: 0.78rem; font-family: inherit;
}
.ui-orch-list-add:hover { color: var(--accent); border-color: var(--accent); }

/* Security & access modal — blast-radius toggles + dispatch allowlist. */
.ui-orch-sec-toggle {
  display: flex; gap: 0.6rem; align-items: flex-start;
  padding: 0.6rem 0.7rem; margin-bottom: 0.5rem;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer;
}
.ui-orch-sec-toggle input { margin-top: 0.15rem; flex-shrink: 0; }
.ui-orch-sec-toggle-name { font-size: 0.85rem; font-weight: 600; color: var(--text); }
.ui-orch-sec-toggle-help { font-size: 0.75rem; color: var(--text-mute); margin-top: 0.15rem; line-height: 1.4; }
.ui-orch-sec-h {
  font-size: 0.8rem; font-weight: 600; color: var(--text);
  margin: 1rem 0 0.3rem;
}
.ui-orch-sec-filter {
  width: 100%; box-sizing: border-box;
  background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text); font-family: inherit; font-size: 0.82rem;
  padding: 0.35rem 0.5rem; border-radius: 4px; margin-bottom: 0.4rem; outline: none;
}
.ui-orch-sec-filter:focus { border-color: var(--accent); }
.ui-orch-sec-picklist {
  max-height: 15rem; overflow-y: auto;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-1);
}
.ui-orch-sec-pick {
  display: flex; gap: 0.55rem; align-items: flex-start;
  padding: 0.4rem 0.6rem; border-top: 1px solid var(--border); cursor: pointer;
}
.ui-orch-sec-pick:first-child { border-top: none; }
.ui-orch-sec-pick input { margin-top: 0.15rem; flex-shrink: 0; }
.ui-orch-sec-pick-name { font-size: 0.83rem; color: var(--text); font-weight: 600; }
.ui-orch-sec-pick-desc { font-size: 0.74rem; color: var(--text-mute); margin-top: 0.1rem; line-height: 1.35; }
.ui-orch-sec-badge {
  font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-mute); border: 1px solid var(--border); border-radius: 3px;
  padding: 0 0.25rem; margin-left: 0.4rem; vertical-align: middle;
}
.ui-orch-sec-count { font-size: 0.74rem; color: var(--text-mute); margin-top: 0.35rem; }
.ui-orch-sec-empty { font-size: 0.78rem; color: var(--text-mute); padding: 0.6rem; text-align: center; }
.ui-orch-sec-dim-note {
  font-size: 0.74rem; color: var(--danger); margin-top: 0.4rem; line-height: 1.4; display: none;
}

.ui-orch-interject-edit-row {
  display: flex; gap: 0.3rem; margin-top: 0.3rem; justify-content: flex-end;
}

/* Tools / Memory / Rules buttons relocated into the modes row sit
 * next to the Private pill. Compact them to roughly the pill's
 * footprint so the row reads as one cohesive strip rather than two
 * mismatched button styles. */
.ui-agent-modes .ui-row-btn {
  padding: 0.25rem 0.65rem;
  font-size: 0.76rem;
  border-radius: 4px;
}

/* Intake form rendered in the conversation pane on the FIRST turn
 * of a new session when the active agent has intake_form configured.
 * Submitting packs values into a markdown user message and hands
 * off to the normal chat send path. */
.ui-orch-intake {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.9rem 1rem;
  margin: 1.5rem auto;
  width: 100%;
  max-width: 520px;
  align-self: center;
}
/* Decorated user bubble (intake submitted, now part of history):
 * stretch the bubble across the pane and strip its right-aligned
 * accent so the centered form inside doesn't read as a tiny card
 * pushed off to the right. The form's own border + bg carry the
 * visual identity. */
.ui-agent-msg-user[data-ui-intake="1"] {
  align-self: stretch;
  max-width: 100%;
}
.ui-agent-msg-user[data-ui-intake="1"] .ui-agent-msg-body {
  background: transparent;
  border-right: none;
  padding: 0;
}
.ui-orch-intake-header {
  font-size: 0.85rem;
  color: var(--text-mute);
  margin-bottom: 0.7rem;
}
/* Agency-side agent description block above intake form. Matches
   the look of .ui-agent-empty (which is what the public agent app
   uses for the same text via cfg.empty_text) so Agency and the
   per-app surface render the description identically. */
.ui-agency-agent-desc {
  color: var(--text-mute);
  font-style: italic;
  text-align: center;
  padding: 1.5rem 0;
}
.ui-orch-intake-row {
  display: flex; flex-direction: column; gap: 0.25rem;
  margin-bottom: 0.7rem;
}
.ui-orch-intake-label {
  font-size: 0.78rem; font-weight: 600;
  color: var(--text-hi);
}
.ui-orch-intake-input {
  background: var(--bg-0); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0.4rem 0.55rem; font: inherit;
}
.ui-orch-intake-textarea { resize: vertical; min-height: 3.2rem; }
.ui-orch-intake-help {
  font-size: 0.75rem; color: var(--text-mute);
}
.ui-orch-intake-actions {
  display: flex; justify-content: flex-end; margin-top: 0.5rem;
}
.ui-orch-intake-button-row {

/* Checklist (multi-select) — vertical stack of checkbox+label rows.

  margin: 0;

}

}
.ui-orch-intake-checklist-other {

}
.ui-orch-intake-checklist-other-text {

  background: var(--bg-1);

/* Form-result mirror for the user bubble after intake-form submit.
 * Replaces the raw markdown text with a read-only structured view

.ui-orch-intake-result {
  display: grid;
  grid-template-columns: minmax(8rem, auto) 1fr;

}
.ui-orch-intake-result-label {

}

/* Tools modal: collapsible group sections + master checkbox. The
 * generic ui-checklist-group is a single line header; we add an

.ui-checklist-section { margin-top: 0.4rem; }
.ui-checklist-section:first-child { margin-top: 0; }
.ui-checklist-group-collapsible {
  display: flex; align-items: center; gap: 0.4rem;

  padding: 0.35rem 0.3rem;
