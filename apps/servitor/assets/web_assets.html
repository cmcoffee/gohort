      }
      buildBundleSection();

      // Tool-backed service section — the Domain paragraph plus one row per
      // bindable tool with its posture. Loaded lazily like the other pickers.
      var domainIn = el('textarea', {class: 'ui-form-input', rows: 3,
        placeholder: 'What is this target? e.g. "A GitLab project: issues, merge requests, pipelines, and file contents."'});
      domainIn.value = rec.domain || '';
      var tsBound = {};
      (rec.toolset || []).forEach(function(b){ tsBound[b.name] = b; });
      var tsBox = el('div', {}, ['Loading tools…']);
      var tsLoaded = false;
      function loadBindableTools() {
        if (tsLoaded) return;
        tsLoaded = true;
        var q = rec.id ? ('?appliance_id=' + encodeURIComponent(rec.id)) : '';
        fetch('api/bindable-tools' + q)
          .then(function(r){ return r.ok ? r.json() : []; })
          .then(function(list) {
            tsBox.innerHTML = '';
            if (!list || !list.length) {
              tsBox.appendChild(el('div', {class: 'ui-form-hint'},
                ['You have no tools in your pool yet. Author them with the Builder first, then bind them here.']));
              return;
            }
            // Grouped by the tool's self-declared category, the same way the
            // agent Tools modal presents them — so a user binding tools here
            // reads the organization they already know from an agent's kit,
            // MCP-per-server headings included.
            var groups = {}, order = [];
            list.forEach(function(t) {
              var g = t.group || 'My Tools';
              if (!groups[g]) { groups[g] = []; order.push(g); }
              groups[g].push(t);
            });
            order.sort(function(a, b) { return a.localeCompare(b); });
            var flat = [];
            order.forEach(function(g) {
              tsBox.appendChild(el('div', {
                style: 'margin:0.6rem 0 0.2rem; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; opacity:0.6;'},
                [g]));
              groups[g].forEach(function(t) { flat.push(t); renderToolRow(t); });
            });
            function renderToolRow(t) {
              var row = el('div', {style: 'display:flex; align-items:center; gap:0.5rem; padding:0.25rem 0; flex-wrap:wrap;'});
              var cb = el('input', {type: 'checkbox'});
              cb.checked = !!tsBound[t.name];
              var sel = el('select', {class: 'ui-form-input', style: 'width:auto; padding:0.15rem 0.4rem;'});
              ['ask', 'allow'].forEach(function(p) {
                var o = el('option', {value: p}, [p === 'ask' ? 'ask first' : 'run freely']);
                if ((tsBound[t.name] && tsBound[t.name].posture) === p) o.selected = true;
                sel.appendChild(o);
              });
              var snap = el('input', {type: 'radio', name: 'ts_snapshot'});
              snap.checked = !!(tsBound[t.name] && tsBound[t.name].snapshot);
              function sync() {
                if (cb.checked) {
                  tsBound[t.name] = {name: t.name, posture: sel.value, snapshot: snap.checked};
                } else {
                  delete tsBound[t.name];
                  snap.checked = false;
                }
                sel.disabled = !cb.checked;
                snap.disabled = !cb.checked;
              }
              cb.onchange = sync; sel.onchange = sync; snap.onchange = sync;
              sel.disabled = !cb.checked; snap.disabled = !cb.checked;
              row.appendChild(cb);
              row.appendChild(el('strong', {}, [t.name]));
              row.appendChild(sel);
              row.appendChild(el('label', {style: 'font-size:0.8rem; display:flex; align-items:center; gap:0.25rem;'},
                [snap, 'orientation']));
              if (t.changed) {
                row.appendChild(el('span', {style: 'font-size:0.78rem; color:var(--danger,#d9534f);'},
                  ['changed since approval — re-save to re-approve']));
              }
              if (t.desc) row.appendChild(el('div', {class: 'ui-form-hint', style: 'flex-basis:100%; margin:0;'}, [t.desc]));
              tsBox.appendChild(row);
            }
          })
          .catch(function() {
            tsBox.innerHTML = '';
            tsBox.appendChild(el('div', {class: 'ui-form-hint'}, ['Failed to load your tools.']));
          });
      }
      var toolsetSection = el('div', {class: 'ui-servitor-app-section'}, [
        el('label', {}, ['What this target is']), domainIn,
        el('div', {class: 'ui-form-hint'},
          ['The tools\' own descriptions carry most of the detail. This adds what the target is as a whole, and what counts as a good answer about it.']),
        el('label', {}, ['Tools it may use']), tsBox,
        el('div', {class: 'ui-form-hint'},
          ['Only the tools you tick are reachable — there is no shell here. "ask first" prompts you per call. "orientation" marks the one cheap tool run at the start of a mapping session to orient the investigator. Each binding records a fingerprint of the tool as approved; if the tool is edited later it is withheld until you re-save this appliance.']),
      ]);

      // Remote section — a stub pointing at an appliance on another instance.
      // Nothing is configured here except WHICH one: the credentials, the SSH
      // config and the accumulated knowledge all stay on that instance, and the
      // only thing that crosses the wire is the question.
      var remotePeerIn = el('input', {type: 'hidden', value: rec.peer_name || ''});
      var remoteIDIn = el('input', {type: 'hidden', value: rec.remote_id || ''});
      // The far side's type. Stored AS the appliance's type, so an SSH box
      // reached through a peer gets the SSH prompts and tools rather than a
      // second, thinner code path that would drift from them.
      var remoteKindIn = el('input', {type: 'hidden', value: rec.remote_kind || 'ssh'});
      var remoteBox = el('div', {}, ['Loading remote systems…']);
      var remoteLoaded = false;
      function loadRemoteAppliances() {
        if (remoteLoaded) return;
        remoteLoaded = true;
        fetch('api/peer-appliances')
          .then(function(r){ return r.ok ? r.json() : []; })
          .then(function(list) {
            remoteBox.innerHTML = '';
            if (!list || !list.length) {
              remoteBox.appendChild(el('div', {class: 'ui-form-hint'},
                ['No peer is offering any systems. On the OTHER instance, mint a peer key granting ' +
                 '"investigate" and pick which systems it may reach (Admin \u203a Resource Sharing \u203a Keys \u203a Grants). ' +
                 'Then register that instance under Peers here.']));
              return;
            }
            var sel = el('select', {class: 'ui-form-input'});
            sel.appendChild(el('option', {value: ''}, ['— pick a system —']));
            list.forEach(function(it) {
              var v = it.peer + '\u0000' + it.id + '\u0000' + (it.kind || 'ssh');
              var label = it.peer + ' \u00b7 ' + it.name;
              if (it.kind) label += ' (' + it.kind + ')';
              if (it.desc) label += ' \u2014 ' + it.desc;
              var o = el('option', {value: v}, [label]);
              if (it.peer === remotePeerIn.value && it.id === remoteIDIn.value) o.selected = true;
              sel.appendChild(o);
            });
            sel.onchange = function() {
              var parts = sel.value.split('\u0000');
              remotePeerIn.value = parts[0] || '';
              remoteIDIn.value = parts[1] || '';
              remoteKindIn.value = parts[2] || 'ssh';
              // Default the name to what the far side calls it, so a stub is
              // recognizable without the user retyping it.
              if (!nameIn.value.trim() && sel.selectedIndex > 0) {
                var chosen = list[sel.selectedIndex - 1];
                if (chosen) nameIn.value = chosen.name;
              }
            };
            remoteBox.appendChild(sel);
          })
          .catch(function() {
            remoteBox.innerHTML = '';
            remoteBox.appendChild(el('div', {class: 'ui-form-hint'}, ['Failed to load remote systems.']));
          });
      }
      var remoteSection = el('div', {class: 'ui-servitor-app-section'}, [
        el('label', {}, ['System on a peer']), remoteBox, remotePeerIn, remoteIDIn, remoteKindIn,
        el('div', {class: 'ui-form-hint'},
          ['For a machine this instance cannot route to but a peer can. The peer is used as a WIRE: ' +
           'the investigation runs HERE \u2014 your plan, your probes, your risk gate, your approvals, your ' +
           'accumulated knowledge \u2014 and only each command travels. It behaves like a local system in every ' +
           'other respect. Requires the "Run commands" grant on the peer key over there.']),
      ]);

      // Peers that may investigate this system. Sits beside the Shared toggle
      // because it answers the same question the user came here to ask —
      // who can see this box — and the grant itself lives on a peer key in
      // Admin, which is not where anyone thinks to look.
      var peerShareBox = el('div', {});
      var peerShareLoaded = false;
      function loadAppliancePeers() {
        if (!rec.id) {
          peerShareBox.innerHTML = '';
          peerShareBox.appendChild(el('div', {class: 'ui-form-hint'},
            ['Save this system first, then reopen it to share it with a peer.']));
          return;
        }
        if (peerShareLoaded) return;
        peerShareLoaded = true;
        fetch('api/appliance-peers?appliance_id=' + encodeURIComponent(rec.id))
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d) {
            peerShareBox.innerHTML = '';
            if (!d || !d.keys || !d.keys.length) {
              peerShareBox.appendChild(el('div', {class: 'ui-form-hint'},
                ['No peer keys grant investigation yet. An admin mints one under ' +
                 'Admin \u203a Resource Sharing \u203a Keys, granting "Investigate systems".']));
              return;
            }
            d.keys.forEach(function(k) {
              var row = el('div', {style: 'display:flex; align-items:center; gap:0.5rem; padding:0.2rem 0; flex-wrap:wrap;'});
              var cb = el('input', {type: 'checkbox'});
              cb.checked = !!k.granted;
              cb.disabled = !d.can_manage || !!k.blocked;
              cb.onchange = function() {
                cb.disabled = true;
                fetch('api/appliance-peers', {method: 'POST', headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({appliance_id: rec.id, key_id: k.key_id, granted: cb.checked})})
                  .then(function(r) {
                    cb.disabled = !d.can_manage;
                    if (!r.ok) return r.text().then(function(t) {
                      cb.checked = !cb.checked;
                      window.uiAlert(t);
                    });
                  });
              };
              row.appendChild(cb);
              row.appendChild(el('span', {}, [k.label || k.key_id]));
              if (k.owner) row.appendChild(el('span', {class: 'ui-form-hint', style: 'margin:0;'}, ['runs as ' + k.owner]));
              if (k.blocked) row.appendChild(el('span', {style: 'font-size:0.78rem; color:var(--text-mute);'}, [k.blocked]));
              peerShareBox.appendChild(row);
            });
            if (!d.can_manage) {
              peerShareBox.appendChild(el('div', {class: 'ui-form-hint'},
                ['Only this system\u2019s owner or an admin can change these.']));
            }
          })
          .catch(function() {
            peerShareBox.innerHTML = '';
            peerShareBox.appendChild(el('div', {class: 'ui-form-hint'}, ['Failed to load peer keys.']));
          });
      }
      var peerShareSection = el('div', {class: 'ui-servitor-app-section'}, [
        el('label', {}, ['Peers that may investigate this']), peerShareBox,
        el('div', {class: 'ui-form-hint'},
          ['For another gohort instance that cannot reach this system itself. It sends a QUESTION; ' +
           'this instance runs the investigation, read-only, under its own approval rules, and returns the answer. ' +
           'No command from the peer is executed here and no credential leaves this machine. ' +
           'Revoke any time here or on the key.']),
      ]);
      loadAppliancePeers();

      function setType(t) {
        rec.type = t;
        typeSsh.classList.toggle('primary', t === 'ssh');
        typeCmd.classList.toggle('primary', t === 'command');
        typeRepo.classList.toggle('primary', t === 'repo');
        typeBundle.classList.toggle('primary', t === 'bundle');
        typeWorkspace.classList.toggle('primary', t === 'workspace');
        sshSection.style.display = t === 'ssh' ? '' : 'none';
        cmdSection.style.display = t === 'command' ? '' : 'none';
        repoSection.style.display = t === 'repo' ? '' : 'none';
        bundleSection.style.display = t === 'bundle' ? '' : 'none';
        toolsetSection.style.display = t === 'toolset' ? '' : 'none';
        remoteSection.style.display = t === 'remote' ? '' : 'none';
        // A remote stub owns nothing here, so there is nothing to lend onward;
        // a workspace's members are shared individually.
        peerShareSection.style.display = (t === 'remote' || t === 'workspace') ? 'none' : '';
        typeRemote.classList.toggle('primary', t === 'remote');
        if (t === 'remote') loadRemoteAppliances();
        typeToolset.classList.toggle('primary', t === 'toolset');
        if (t === 'toolset') loadBindableTools();
        workspaceSection.style.display = t === 'workspace' ? '' : 'none';
        // A bundle carries linked repos for the same reason a live system does:
        // a stack frame in the evidence should reach the line that emitted it.
        linkedRepoSection.style.display =
          (t === 'ssh' || t === 'command' || t === 'bundle') ? '' : 'none';
        if (t === 'workspace') loadWorkspaceMembers();
        if (t === 'ssh' || t === 'command' || t === 'bundle') loadLinkedRepos();
      }
      setType(rec.type || 'ssh');

      // Shared fields
      var instrIn = el('textarea', {class: 'ui-form-input', rows: 3,
        placeholder: 'Optional. App-specific CLI tools, known quirks, workflow notes…'});
      instrIn.value = rec.instructions || '';
      var personaNameIn = el('input', {type: 'text', class: 'ui-form-input',
        placeholder: 'Persona name (e.g. Support, QA, DevOps)',
        value: rec.persona_name || ''});
      var personaPromptIn = el('textarea', {class: 'ui-form-input', rows: 3,
        placeholder: 'Describe how the AI should approach this appliance…'});
      personaPromptIn.value = rec.persona_prompt || '';

      // Linked Knowledge — collections the investigator can search (via
      // search_knowledge) to ground answers in curated reference material.
      // Rendered with the canonical chip_picker (same component guides /
      // orchestrate use) in LOCAL mode: the selection rides along in the
      // appliance save payload below via on_change, so there's no separate
      // attach endpoint — one Create/Save writes the whole record.
      var kbSelected = (rec.collections || []).slice();
      var kbBox = el('div', {});
      window.uiMountComponent({
        type: 'chip_picker', mode: 'attach',
        options_source: 'api/collections',
        value: kbSelected,
        name_field: 'id', label_field: 'name', desc_field: 'description',
        noun: 'collection',
        intro: 'Curated collections the investigator can search (via search_knowledge) to ground answers in reference material (runbooks, vendor docs, a guide) alongside what it finds on the system itself.',
        empty_text: 'No knowledge collections yet — create some in the Knowledge app, then link them here.',
        on_change: function(sel){ kbSelected = sel; }
      }, kbBox);
      var knowledgeSection = el('div', {class: 'ui-servitor-app-section'}, [
        el('label', {}, ['Linked Knowledge']), kbBox,
      ]);


      // Model tier overrides. Two selects rather than one: the orchestrator is
      // one call per round reasoning about the whole investigation, while the
      // workers are the high-volume half running the commands, so pinning those
      // to the lead is a much larger cost change and has to be chosen on its
      // own. "" follows the global LLM Routing setting.
      //
      // Lead is only offered when the deployment permits one at all
      // (lead_tier_available, from Model Privacy). Servitor is pinned to the
      // worker otherwise, so listing it would be a control that saves, reads
      // back correctly and does nothing — and the server refuses it anyway.
      function tierSelect(current, what) {
        var sel = el('select', {class: 'ui-form-input'});
        var opts = [['', 'Follow routing'], ['worker', 'Worker (always)']];
        if (rec.lead_tier_available) opts.push(['lead', 'Lead (always)']);
        opts.forEach(function(o) {
          var opt = el('option', {value: o[0]}, [o[1]]);
          if ((current || '') === o[0]) opt.selected = true;
          sel.appendChild(opt);
        });
        return sel;
      }
      var orchTierIn = tierSelect(rec.orchestrator_tier, 'the orchestrator');
      var workTierIn = tierSelect(rec.worker_tier, 'the workers');
      var tierHint = el('div', {class: 'ui-form-hint'}, [rec.lead_tier_available
        ? 'Overrides Admin \u2192 LLMs \u2192 LLM Routing for this system alone.'
        : 'Overrides LLM Routing for this system alone. "Lead" is not offered: Servitor handles credentials and log contents, so it stays on the worker unless every configured model is private (Admin \u2192 LLMs \u2192 Model Privacy).']);
      var tierSection = el('div', {class: 'ui-servitor-app-section'}, [
        el('label', {}, ['Model']),
        el('label', {class: 'ui-form-sublabel'}, ['Orchestrator']), orchTierIn,
        el('label', {class: 'ui-form-sublabel'}, ['Workers']), workTierIn,
        tierHint,
      ]);

      // Whose credentials the bound tools use once this system is SHARED.
      // Only meaningful for a toolset; SSH passwords and repo tokens are the
      // appliance's own access and are always the owner's, which is what
      // sharing an appliance means.
      var runAsIn = el('select', {class: 'ui-form-input'});
      [['owner', "The owner's credentials"], ['caller', "Each user's own credentials"]]
        .forEach(function(o) {
          var opt = el('option', {value: o[0]}, [o[1]]);
          if ((rec.tools_run_as || 'owner') === o[0]) opt.selected = true;
          runAsIn.appendChild(opt);
        });
      var runAsSection = el('div', {class: 'ui-servitor-app-section'}, [
        el('label', {}, ['Tools run as']), runAsIn,
        el('div', {class: 'ui-form-hint'}, [
          "Applies to this system's bound tools when it is shared. The owner's: everyone " +
          "uses your keys — right for a read-only service account. Each user's own: the caller " +
          "supplies their own credential, so writes are attributable and permissions are theirs. " +
          "A tool bound to a credential in your personal namespace cannot be used by anyone else, " +
          "and is withheld with an explanation rather than failing at call time. SSH passwords and " +
          "repository tokens are always the owner's."]),
      ]);
      if (rec.type !== 'toolset') { runAsSection.style.display = 'none'; }

      // Shared toggle — when on, every user can discover and use this
      // appliance/repo (owner's creds, one repo clone, shared accumulated
      // knowledge) while keeping their own chat sessions.
      var sharedIn = el('input', {type: 'checkbox'});
      sharedIn.checked = !!rec.shared;
      var sharedRow = el('label', {class: 'ui-servitor-shared-row',
        style: 'display:flex; align-items:center; gap:0.5rem; margin-top:0.4rem; font-weight:600;'},
        [sharedIn, 'Shared with all users']);
      var sharedHint = el('div', {class: 'ui-form-hint'},
        ['Everyone can open and use it (with the stored credentials); chat sessions stay per-user. Only you or an admin can change or delete it.']);

      var body = el('div', {class: 'ui-pl-modal-body'}, [
        el('label', {}, ['Name *']), nameIn,
        typeRow, sshSection, cmdSection, repoSection, bundleSection, toolsetSection, remoteSection, workspaceSection,
        el('label', {}, ['Custom Instructions']), instrIn,
        el('label', {}, ['Persona']),
        personaNameIn, personaPromptIn,
        linkedRepoSection,
        knowledgeSection,
        runAsSection,
        tierSection,
        peerShareSection,
        sharedRow, sharedHint,
      ]);

      var m = openModal(isEdit ? 'Edit Appliance' : 'New Appliance', body);

      var saveBtn = el('button', {class: 'ui-row-btn primary',
        onclick: function() {
          var payload = {
            id:             rec.id || '',
            type:           rec.type,
            name:           nameIn.value.trim(),
            host:           hostIn.value.trim(),
            port:           parseInt(portIn.value, 10) || 22,
            user:           userIn.value.trim(),
            password:       passIn.value,
            command:        cmdIn.value.trim(),
            work_dir:       workIn.value.trim(),
            tools_only:     toolsOnlyIn.checked,
            env_vars:       envIn.value.split('\n').map(function(s){return s.trim();}).filter(Boolean),
            repo_url:       repoUrlIn.value.trim(),
            repo_branch:    repoBranchIn.value.trim(),
            repo_token:     repoTokenIn.value,
            repo_skip_dirs: repoSkipIn.value.split(',').map(function(s){return s.trim();}).filter(Boolean),
            instructions:   instrIn.value,
            persona_name:   personaNameIn.value.trim(),
            persona_prompt: personaPromptIn.value,
            shared:         sharedIn.checked,
            members:        wsSelected.slice(),
            member_roles:   wsRoles,
            member_links:   wsLinks,
            collections:    kbSelected.slice(),
            tools_run_as:      runAsIn.value,
            orchestrator_tier: orchTierIn.value,
            worker_tier:       workTierIn.value,
            linked_repos:   lrSelected.slice(),
            domain:         domainIn.value.trim(),
            peer_name:      remotePeerIn.value,
            remote_id:      remoteIDIn.value,
            remote_kind:    remoteKindIn.value,
            toolset:        Object.keys(tsBound).map(function(k){ return tsBound[k]; }),
          };
          // Name is optional for repos — the server derives owner/repo from the URL.
          if (!payload.name && payload.type !== 'repo') { window.uiAlert('Name is required'); return; }
          if (payload.type === 'ssh' && !payload.host) { window.uiAlert('Host is required'); return; }
          if (payload.type === 'command' && !payload.command) { window.uiAlert('Command is required'); return; }
          if (payload.type === 'repo' && !payload.repo_url) { window.uiAlert('Git URL is required'); return; }
          if (payload.type === 'bundle' && !payload.name) { window.uiAlert('Name is required'); return; }
          if (payload.type === 'toolset' && !payload.toolset.length) { window.uiAlert('Pick at least one tool this system may use'); return; }
          if (payload.type === 'remote' && (!payload.peer_name || !payload.remote_id)) { window.uiAlert('Pick the system on the peer'); return; }
          if (payload.type === 'workspace' && !payload.members.length) { window.uiAlert('Select at least one member appliance'); return; }
          saveBtn.disabled = true;
          fetch('api/appliances', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          }).then(function(r) {
            saveBtn.disabled = false;
            if (!r.ok) { return r.text().then(function(t){ window.uiAlert('Save failed: ' + t); }); }
            m.close();
            // Reload the page so the appliance picker reflects the
            // change. Simpler than threading a refresh callback up
            // through ExtraFields rebuild — the page is cheap.
            window.location.reload();
          });
        }}, [isEdit ? 'Save' : 'Create']);
      var cancelBtn = el('button', {class: 'ui-row-btn',
        onclick: function(){ m.close(); }}, ['Cancel']);
      m.footer(cancelBtn, saveBtn);

      // Edit-only: delete affordance.
      if (isEdit) {
        var delBtn = el('button', {class: 'ui-row-btn danger',
          style: 'margin-right: auto',
          onclick: async function() {
            if (!(await window.uiConfirm('Delete this appliance? All saved facts, rules, and sessions will remain but become orphaned.'))) return;
            fetch('api/appliance/' + encodeURIComponent(rec.id),
              {method: 'DELETE'}).then(function() {
              m.close();
              window.location.reload();
            });
          }}, ['Delete']);
        m.footer(delBtn, cancelBtn, saveBtn);
      }
    }

    // Access — who may use THIS appliance, and what they have asked to run on
    // it. Both halves live here because they are the same decision at two
    // moments: connecting an agent lets it ASK, approving a capability lets it
    // RUN that one command. Neither implies the other.
    function openAccessModal(applianceID, applianceName) {
      var body = el('div', {});
      var agentsBox = el('div', {}, ['Loading agents…']);
      var capsBox = el('div', {}, ['Loading requests…']);

      body.appendChild(el('div', {class: 'ui-form-label'}, ['Agents that may use ' + applianceName]));
      body.appendChild(el('div', {class: 'ui-form-help'},
        ['Adding an agent lets it ASK for commands on this system. It grants no commands by itself — each one it proposes appears below for your approval.']));
      body.appendChild(agentsBox);
      body.appendChild(el('div', {class: 'ui-form-label', style: 'margin-top:16px'}, ['Requested commands']));
      body.appendChild(el('div', {class: 'ui-form-help'},
        ['Read the command before approving. An approved command runs whenever the agent decides to use it, without asking again.']));
      body.appendChild(capsBox);

      var m = openModal('Access — ' + applianceName, body);
      m.footer(el('button', {class: 'ui-row-btn', onclick: function(){ m.close(); }}, ['Done']));

      // Only agents that HAVE access are listed, with a + to add one.
      //
      // A checkbox per agent was the first shape and it scales backwards: a
      // fleet of a dozen renders eleven unticked boxes to say one thing, and
      // the answer to "who can use this box" has to be read by scanning for
      // ticks. Listing what is granted says it directly, and the list stays
      // short because access is meant to be.
      function renderAgents() {
        Promise.all([
          fetch('api/access-agents').then(function(r){ return r.json(); }),
          fetch('api/command-grants').then(function(r){ return r.json(); })
        ]).then(function(res) {
          var agents = res[0] || [], grants = res[1] || [];
          // One grant, one machine. There is no wildcard to reconcile — a
          // pairing nobody looked at is not one anybody approved.
          var here = {};
          grants.forEach(function(g) {
            if (g.appliance_id === applianceID) here[g.agent_id] = true;
          });
          agentsBox.innerHTML = '';
          if (!agents.length) {
            agentsBox.appendChild(el('div', {class: 'ui-form-help'}, ['You have no agents yet.']));
            return;
          }
          var connected = agents.filter(function(a){ return here[a.value]; });
          var available = agents.filter(function(a){ return !here[a.value]; });

          if (!connected.length) {
            agentsBox.appendChild(el('div', {class: 'ui-form-help'}, ['No agent has access to this system yet.']));
          }
          connected.forEach(function(a) {
            var kids = [el('span', {}, [a.label]),
              el('button', {class: 'ui-row-btn danger', style: 'margin-left:auto',
                onclick: async function() {
                  if (!(await window.uiConfirm('Remove ' + a.label + "'s access to this system? " +
                    'Commands already approved for it here stop working.'))) return;
                  fetch('api/command-grants?agent_id=' + encodeURIComponent(a.value) +
                    '&appliance_id=' + encodeURIComponent(applianceID), {method: 'DELETE'})
                    .then(function(){ renderAgents(); renderCaps(); });
                }}, ['Remove'])];
            agentsBox.appendChild(el('div', {class: 'ui-servitor-access-row'}, kids));
          });

          if (!available.length) {
            if (connected.length) {
              agentsBox.appendChild(el('div', {class: 'ui-form-help'}, ['Every agent already has access.']));
            }
            return;
          }
          var addBtn = el('button', {class: 'ui-row-btn'}, ['+ Add agent']);
          addBtn.onclick = function() {
            var sel = el('select', {class: 'ui-form-input'},
              available.map(function(a){ return el('option', {value: a.value}, [a.label]); }));
            var ok = el('button', {class: 'ui-wb-action-btn', onclick: function() {
              fetch('api/command-grants', {method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({agent_id: sel.value, appliance_id: applianceID})})
                .then(function(){ renderAgents(); renderCaps(); })
                .catch(function(err){ window.uiAlert('Could not add: ' + (err && err.message || err)); });
            }}, ['Add']);
            var cancel = el('button', {class: 'ui-row-btn', onclick: function(){ renderAgents(); }}, ['Cancel']);
            picker.innerHTML = '';
            picker.appendChild(el('div', {class: 'ui-servitor-access-row'}, [sel, ok, cancel]));
          };
          var picker = el('div', {});
          agentsBox.appendChild(addBtn);
          agentsBox.appendChild(picker);
        });
      }

      function renderCaps() {
        fetch('api/appliance-tools').then(function(r){ return r.json(); }).then(function(rows) {
          var mine = (rows || []).filter(function(t){ return t.appliance_id === applianceID; });
          capsBox.innerHTML = '';
          if (!mine.length) {
            capsBox.appendChild(el('div', {class: 'ui-form-help'},
              ['Nothing requested yet. A connected agent asks when it needs to do something here and has no command for it.']));
            return;
          }
          mine.forEach(function(t) {
            var head = el('div', {}, [el('strong', {}, [t.name]),
              el('span', {class: 'ui-form-help'}, [' — ' + (t.approved ? 'approved' : 'pending') + (t.risk ? ' · ' + t.risk : '')])]);
            // The command itself, never behind a disclosure: approving without
            // reading it is the failure this whole surface exists to prevent.
            var cmd = el('code', {class: 'ui-servitor-access-cmd'}, [t.command]);
            var act = el('button', {class: t.approved ? 'ui-row-btn' : 'ui-wb-action-btn',
              onclick: async function() {
                if (!t.approved && !(await window.uiConfirm(
                  'Approve "' + t.name + '"?\n\nIt runs:\n' + t.command +
                  '\n\nThe agent will be able to run this whenever it decides to, without asking again.'))) return;
                fetch('api/appliance-tool?appliance=' + encodeURIComponent(t.appliance_id) +
                  '&name=' + encodeURIComponent(t.name) + '&approved=' + (t.approved ? '0' : '1'),
                  {method: 'POST'}).then(renderCaps);
              }}, [t.approved ? 'Revoke' : 'Approve']);
            var del = el('button', {class: 'ui-row-btn danger', onclick: async function() {
              if (!(await window.uiConfirm('Delete "' + t.name + '"? The agent would have to ask for it again.'))) return;
              fetch('api/appliance-tool?appliance=' + encodeURIComponent(t.appliance_id) +
                '&name=' + encodeURIComponent(t.name), {method: 'DELETE'}).then(renderCaps);
            }}, ['Delete']);
            capsBox.appendChild(el('div', {class: 'ui-servitor-access-cap'}, [head, cmd, el('div', {}, [act, del])]));
          });
        });
      }

      renderAgents();
      renderCaps();
    }

    window.uiRegisterClientAction('servitor_appliance_access', function() {
      var aid = getApplianceID();
      if (!aid) { window.uiAlert('Pick an appliance first'); return; }
      var sel = document.querySelector('[name="appliance_id"]');
      var name = (sel && sel.options && sel.selectedIndex >= 0) ? sel.options[sel.selectedIndex].text : aid;
      openAccessModal(aid, name);
    });

    window.uiRegisterClientAction('servitor_new_appliance', function() {
      openApplianceModal(null);
    });
    window.uiRegisterClientAction('servitor_edit_appliance', function() {
      var aid = getApplianceID();
      if (!aid) { window.uiAlert('Pick an appliance first'); return; }
      fetch('api/appliance/' + encodeURIComponent(aid))
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(rec) { openApplianceModal(rec); })
        .catch(function(err) {
          window.uiAlert('Failed to load appliance: ' + (err && err.message || err));
        });
    });

    // Per-reply save buttons: assistant replies get TechWriter /
    // CodeWriter buttons depending on which destinations are
    // available. The destinations probe happens once per page.
    var saveDestinations = null;
    function loadSaveDestinations() {
      return fetch('api/save_destinations')
        .then(function(r) { return r.ok ? r.json() : {}; })
        .then(function(d) { saveDestinations = d || {}; })
        .catch(function() { saveDestinations = {}; });
    }
    loadSaveDestinations();

    window.uiRegisterMessageDecorator(function(m) {
      if (m.role !== 'assistant') return;
      if (!m.rawText || !m.rawText.trim()) return;
      // De-dupe: re-finalize calls (markdown re-render) shouldn't
      // append another button row to the same bubble.
      if (m.wrap.querySelector('.ui-servitor-save-row')) return;
      // Wait for the destinations probe if it hasn't returned yet.
      if (saveDestinations === null) {
        loadSaveDestinations().then(function(){ decorate(); });
        return;
      }
      decorate();
      function decorate() {
        var row = document.createElement('div');
        row.className = 'ui-servitor-save-row';

        // The per-reply TechWriter / CodeWriter buttons were removed: the
        // agent's own save_to_techwriter / save_to_codewriter tools cover
        // the same handoff, and they can name and shape the record
        // instead of dumping a raw reply into it. The api/save_article
        // and api/save_snippet endpoints remain for any caller that
        // wants the blunt version.
        //
        // Push this reply into a Guide — but only guides that already list THIS
        // appliance/repo as a source (fetched on click). One match pushes
        // directly; several show a picker.
        if (saveDestinations.guide) {
          var gBtn = makeBtn('↗ Guide', function() {
            var aid = getApplianceID();
            if (!aid) { window.uiAlert('Pick an appliance first'); return; }
            function pushTo(gid) {
              gBtn.disabled = true; gBtn.textContent = 'Incorporating…';
              fetch('api/push-to-guide?appliance_id=' + encodeURIComponent(aid), {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({appliance_id: aid, guide_id: gid, text: m.rawText}),
              }).then(function(r) {
                gBtn.disabled = false;
                gBtn.textContent = r.ok ? 'Saved ✓' : 'Failed';
                if (r.ok) gBtn.classList.add('saved');
              });
            }
            gBtn.disabled = true; gBtn.textContent = 'Loading…';
            fetch('api/push-to-guide?appliance_id=' + encodeURIComponent(aid))
              .then(function(r) { return r.ok ? r.json() : r.text().then(function(t){ throw new Error(t || ('HTTP ' + r.status)); }); })
              .then(function(d) {
                gBtn.disabled = false; gBtn.textContent = '↗ Guide';
                var guides = (d && d.guides) || [];
                if (!guides.length) {
                  window.uiAlert("No guide lists this system as a source yet. Add it via a guide's Sources picker, then push here.");
                  return;
                }
                if (guides.length === 1 || !window.uiOpenSimpleModal) { pushTo(guides[0].id); return; }
                window.uiOpenSimpleModal({title: 'Add to which guide?', width: '420px', mount: function(body, dlg) {
                  guides.forEach(function(g) {
                    var b = document.createElement('button');
                    b.className = 'ui-row-btn'; b.textContent = g.title;
                    b.style.display = 'block'; b.style.width = '100%'; b.style.margin = '0.25rem 0'; b.style.textAlign = 'left';
                    b.onclick = function() { try { dlg.close(); dlg.remove(); } catch(e){} pushTo(g.id); };
                    body.appendChild(b);
                  });
                }});
              })
              .catch(function(err) { gBtn.disabled = false; gBtn.textContent = '↗ Guide'; window.uiAlert('Failed: ' + (err && err.message || err)); });
          });
          row.appendChild(gBtn);
        }

        m.wrap.appendChild(row);
      }
      function makeBtn(label, onclick) {
        var b = document.createElement('button');
        b.className = 'ui-servitor-save-btn';
        b.textContent = label;
        b.onclick = onclick;
        return b;
      }
    });

    window.uiRegisterClientAction('servitor_clear_memory', async function(ctx) {
      var aid = getApplianceID();
      if (!aid) { window.uiAlert('Pick an appliance first'); return; }
      var isRepo = isRepoAppliance(aid);
      var msg = 'Clear all memory for this appliance?\n\n' +
        'This removes:\n' +
        '• System profile (map data)\n' +
        '• Knowledge docs\n' +
        '• Stored facts\n' +
        '• Notes and techniques\n' +
        (isRepo ? '• Ingested code files (the repository will need re-cloning)\n' : '') +
        '\n' +
        'The appliance connection settings are kept. Run "Refresh" to rebuild' +
        (isRepo ? ' (it re-clones, then re-maps).' : '.') + '\n\n' +
        'This cannot be undone.';
      if (!(await window.uiConfirm(msg))) return;
      fetch('api/memory/clear', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({appliance_id: aid}),
      }).then(function(r) {
        if (r.ok) {
          ctx.clearConvo();
          ctx.clearActivity();
        } else {
          window.uiAlert('Failed to clear memory');
        }
      }).catch(function(err) {
        window.uiAlert('Failed: ' + (err && err.message || err));
      });
    });

    // Map App — enumerate the subcommands/flags of a single
    // command on an SSH appliance. Modal collects the command
    // name, POSTs to /api/mapapp, then taps the same event stream
    // the regular Map System uses.
    window.uiRegisterClientAction('servitor_run_mapapp', function(ctx) {
      var aid = getApplianceID();
      if (!aid) { window.uiAlert('Pick an appliance first'); return; }
      var cmdIn = el('input', {type: 'text', class: 'ui-form-input',
        placeholder: 'e.g. kubectl, redis-cli, systemctl',
        style: 'width: 100%'});
      setTimeout(function(){ cmdIn.focus(); }, 50);
      var hint = el('div', {class: 'ui-form-hint'},
        ['The agent will run --help on this command, walk its subcommand tree, and produce a structured reference document.']);
      var body = el('div', {class: 'ui-pl-modal-body'},
        [el('label', {}, ['Command']), cmdIn, hint]);
      var m = openModal('Map App', body);
      var run = function() {
        var cmd = cmdIn.value.trim();
        if (!cmd) { window.uiAlert('Command is required.'); return; }
        runBtn.disabled = true;
        fetch('api/mapapp', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({appliance_id: aid, command: cmd}),
        }).then(function(r) {
          if (!r.ok) { return r.text().then(function(t){ throw new Error(t); }); }
          return r.json();
        }).then(function(d) {
          m.close();
          if (d && d.session_id) {
            // Map App runs in its OWN session (the server minted a fresh
            // session_id) — clear the panes so it doesn't append to whatever
            // conversation is currently open.
            if (ctx.clearConvo) ctx.clearConvo();
            if (ctx.clearActivity) ctx.clearActivity();
            ctx.subscribe('api/chat/v2/events?id=' + encodeURIComponent(d.session_id));
          }
        }).catch(function(err) {
          runBtn.disabled = false;
          window.uiAlert('Map App failed: ' + (err && err.message || err));
        });
      };
      cmdIn.addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); run(); }
      });
      var runBtn = el('button', {class: 'ui-row-btn primary', onclick: run}, ['Run']);
      var cancelBtn = el('button', {class: 'ui-row-btn', onclick: m.close}, ['Cancel']);
      m.footer(cancelBtn, runBtn);
    });

    window.uiRegisterClientAction('servitor_run_map', async function(ctx) {
      var aid = getApplianceID();
      if (!aid) { window.uiAlert('Pick an appliance first'); return; }
      if (!(await window.uiConfirm('Run a full system map on this appliance? This may take a few minutes.'))) return;
      fetch('api/map', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({appliance_id: aid}),
      }).then(function(r) {
        if (!r.ok) { return r.text().then(function(t){ throw new Error(t); }); }
        return r.json();
      }).then(function(d) {
        if (!d || !d.session_id) {
          window.uiAlert('Map did not return a session id');
          return;
        }
        // Tap the same event queue the chat uses — status / cmd /
        // output / plan / intent / etc. flow into the activity +
        // conversation panes as the map progresses. The bridge
        // translator (chat_bridge.go) takes care of mapping the
        // legacy event kinds to AgentLoopPanel events.
        ctx.subscribe('api/chat/v2/events?id=' + encodeURIComponent(d.session_id));
      }).catch(function(err) {
        window.uiAlert('Map failed to start: ' + (err && err.message || err));
      });
    });

    // Export the appliance's accumulated knowledge as a downloadable .md
    // (credentials/secrets excluded server-side) for handing to Claude or
    // another LLM to help build/improve a support tool for this system.
    window.uiRegisterClientAction('servitor_export_knowledge', function() {
      var aid = getApplianceID();
      if (!aid) { window.uiAlert('Pick an appliance first'); return; }
      fetch('api/knowledge/export?appliance_id=' + encodeURIComponent(aid))
        .then(function(r) {
          if (!r.ok) { return r.text().then(function(t) { throw new Error(t || ('HTTP ' + r.status)); }); }
          return r.text();
        })
        .then(function(text) {
          if (!text) { window.uiAlert('Nothing to export yet — map the system first.'); return; }
          var blob = new Blob([text], {type: 'text/markdown'});
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = aid + '-knowledge.md';
          document.body.appendChild(a);
          a.click();
          setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 0);
        })
        .catch(function(err) { window.uiAlert('Export failed: ' + (err && err.message || err)); });
    });

    // --- xterm.js terminal wiring -------------------------------------
    // The framework's AgentLoopPanel reserves the bottom-right pane
    // when Terminal is configured (see chat_page.go). xterm itself
    // lives here because it's servitor-specific. Wire-up:
    //   1. Wait for the .ui-agent-terminal-body slot to land
    //   2. Read the appliance id from the picker
    //   3. Open WebSocket to /api/terminal?id=<aid>
    //   4. Pipe both directions through xterm
    //   5. Reconnect on disconnect with exponential backoff
    //   6. Watch the picker for changes and re-open on appliance swap
    var termInstance = null, termFit = null, termWs = null;
    var termAutoReconnect = false;
    var termReconnectDelay = 2000;
    var termReconnectTimer = null;
    var termLastID = '';

    function makeWsUrl(path) {
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var a = document.createElement('a');
      a.href = path;
      return proto + '//' + a.host + a.pathname + (a.search || '');
    }

    // Repo appliances have nothing to attach a shell to — hide the whole
    // terminal pane (and its resize divider) so the activity column fills
    // the space. show=false collapses it; show=true restores it.
    function setTerminalPaneVisible(show) {
      var pane = document.querySelector('.ui-agent-terminal');
      if (pane) pane.style.display = show ? '' : 'none';
      var hdiv = document.querySelector('.ui-agent-hdivider');
      if (hdiv) hdiv.style.display = show ? '' : 'none';
    }
    function isRepoAppliance(aid) {
      var types = window.servitorApplianceTypes || {};
      return !!aid && types[aid] === 'repo';
    }
    // Repos and workspaces have nothing to attach a shell to.
    function isShelllessAppliance(aid) {
      var t = (window.servitorApplianceTypes || {})[aid] || 'ssh';
      return t === 'repo' || t === 'workspace';
    }
    // Current appliance type ('' when nothing is selected).
    function currentApplianceType() {
      var aid = getApplianceID();
      if (!aid) return '';
      var types = window.servitorApplianceTypes || {};
      return types[aid] || 'ssh';
    }
    // Show/hide a toolbar action (flat button OR overflow-menu item) by label.
    function setActionVisible(label, show) {
      var nodes = document.querySelectorAll('[data-action-label="' + label + '"]');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].style.display = show ? '' : 'none';
      }
    }
    // Gate type-specific toolbar actions to the appliance types they apply to:
    // Map App lets you pick WHICH CLI command to enumerate, so it only makes sense
    // on SSH hosts (many commands). A command-type appliance IS a single command —
    // the only mappable thing — so it doesn't need it; repos have no commands.
    // Refresh Repo re-clones (repo-type only). A workspace owns no system of its
    // own, so it has nothing to map OR refresh — you refresh its members.
    // Everything else stays visible.
    function applyToolbarForType() {
      var t = currentApplianceType();
      setActionVisible('Map App', t === 'ssh');
      setActionVisible('Refresh', t !== 'workspace');
      // One "Refresh" action; its label follows the appliance type. Repo
      // refresh also pulls new code server-side (see handleMap); ssh/command
      // just re-map / re-test. data-action-label stays "Refresh" for targeting.
      var lbl = t === 'repo' ? 'Refresh Repo' : (t === 'command' ? 'Refresh Command' : 'Refresh System');
      var nodes = document.querySelectorAll('[data-action-label="Refresh"]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = lbl;
    }
    // Repo appliances have no terminal, so halve the activity column's default
    // width (via the servitor-repo-mode CSS class) and give the conversation the
    // freed space. Both panes keep growing, so no dead gap.
    function applyRepoLayout() {
      var wrap = document.querySelector('.ui-agent');
      if (wrap) wrap.classList.toggle('servitor-repo-mode', isShelllessAppliance(getApplianceID()));
    }

    function openTerminal() {
      if (typeof Terminal === 'undefined' || typeof FitAddon === 'undefined') return;
      var cont = document.querySelector('.ui-agent-terminal-body');
      if (!cont) return;
      var aid = getApplianceID();
      if (isShelllessAppliance(aid)) {
        // No shell for a repository or workspace — tear down any open socket and hide the pane.
        closeTerminalSocket();
        termLastID = '';
        setTerminalPaneVisible(false);
        return;
      }
      setTerminalPaneVisible(true);
      if (!aid) {
        closeTerminalSocket();
        cont.innerHTML = '';
        var ph = document.createElement('div');
        ph.className = 'ui-agent-terminal-placeholder';
        ph.textContent = '(pick an appliance to connect)';
        cont.appendChild(ph);
        termLastID = '';
        return;
      }
      if (aid === termLastID && termWs && termWs.readyState === WebSocket.OPEN) {
        return; // already connected to this appliance
      }
      termLastID = aid;
      closeTerminalSocket();
      termAutoReconnect = true;
      cont.innerHTML = '';

      if (!termInstance) {
        termInstance = new Terminal({
          theme: { background: '#0d1117', foreground: '#e6edf3',
            cursor: '#58a6ff', selectionBackground: '#264f78' },
          fontSize: 13,
          fontFamily: 'ui-monospace, Menlo, Consolas, "Courier New", monospace',
          cursorBlink: true,
          scrollback: 3000,
        });
        termFit = new FitAddon.FitAddon();
        termInstance.loadAddon(termFit);
        termInstance.open(cont);
        try { termFit.fit(); } catch (_) {}
        var ro = new ResizeObserver(function() { try { termFit.fit(); } catch (_) {} });
        ro.observe(cont);
        termInstance.onResize(function(sz) {
          if (termWs && termWs.readyState === WebSocket.OPEN) {
            termWs.send(JSON.stringify({type:'resize', cols:sz.cols, rows:sz.rows}));
          }
        });
        termInstance.onData(function(data) {
          if (termWs && termWs.readyState === WebSocket.OPEN) {
            termWs.send(data);
          }
        });
      } else {
        termInstance.open(cont);
        try { termFit.fit(); } catch (_) {}
      }

      termWs = new WebSocket(makeWsUrl('api/terminal?id=' + encodeURIComponent(aid)));
      termWs.binaryType = 'arraybuffer';
      termWs.onopen = function() {
        termReconnectDelay = 2000;
        clearTimeout(termReconnectTimer);
        termWs.send(JSON.stringify({type:'resize',
          cols:termInstance.cols, rows:termInstance.rows}));
      };
      termWs.onmessage = function(e) {
        if (e.data instanceof ArrayBuffer) {
          termInstance.write(new Uint8Array(e.data));
        } else {
          termInstance.write(e.data);
        }
      };
      termWs.onclose = function() {
        if (termInstance) termInstance.write('\r\n\x1b[2m[session closed]\x1b[0m\r\n');
        scheduleTerminalReconnect();
      };
      termWs.onerror = function() {
        if (termInstance) termInstance.write('\r\n\x1b[31m[connection error]\x1b[0m\r\n');
      };
    }

    function scheduleTerminalReconnect() {
      if (!termAutoReconnect) return;
      clearTimeout(termReconnectTimer);
      var delay = termReconnectDelay;
      termReconnectDelay = Math.min(termReconnectDelay * 2, 16000);
      termReconnectTimer = setTimeout(function() {
        if (!termAutoReconnect) return;
        if (termInstance) termInstance.write('\x1b[2m[reconnecting…]\x1b[0m\r\n');
        openTerminal();
      }, delay);
    }

    function closeTerminalSocket() {
      termAutoReconnect = false;
      clearTimeout(termReconnectTimer);
      if (termWs) {
        try { termWs.onclose = null; termWs.onerror = null; termWs.close(); } catch (_) {}
        termWs = null;
      }
    }

    // Wait for the framework to mount AgentLoopPanel (the slot
    // appears once mount completes). Poll briefly then attempt
    // open. Subsequent appliance picker changes re-trigger.
    function bootTerminal(tries) {
      var cont = document.querySelector('.ui-agent-terminal-body');
      if (!cont) {
        if (tries < 30) setTimeout(function(){ bootTerminal(tries + 1); }, 100);
        return;
      }
      openTerminal();
    }
    bootTerminal(0);

    // Gate type-specific toolbar actions once the actions bar has rendered.
    function bootToolbarGate(tries) {
      if (!document.querySelector('[data-action-label]')) {
        if (tries < 30) setTimeout(function(){ bootToolbarGate(tries + 1); }, 100);
        return;
      }
      applyToolbarForType();
      applyRepoLayout();
    }
    bootToolbarGate(0);

    // On reconnect, the bridge enriches the session event with the
    // session's appliance_id. Set the picker so the terminal + the
    // session list scope to the right context automatically.
    window.addEventListener('ui-agent-session', function(ev) {
      var aid = ev.detail && ev.detail.appliance_id;
      if (!aid) return;
      var sel = document.querySelector('.ui-agent-extras select');
      if (!sel || sel.value === aid) return;
      sel.value = aid;
      // Fire change so existing listeners (terminal + session
      // list refresh + facts badge) re-run for the new appliance.
      sel.dispatchEvent(new Event('change', {bubbles: true}));
    });

    // Hook the appliance picker so swaps re-open the terminal, re-gate the
    // type-specific toolbar actions, and remember the selection across reloads.
    document.addEventListener('change', function(ev) {
      if (ev.target && ev.target.matches &&
          ev.target.matches('.ui-agent-extras select')) {
        try { localStorage.setItem('servitor_last_appliance', ev.target.value || ''); } catch (_) {}
        openTerminal();
        applyToolbarForType();
        applyRepoLayout();
      }
    });

    // Restore the last-selected appliance on load. Without this the picker
    // resets to the placeholder on every reload, which (a) loses the user's
    // selection and (b) makes a deep-linked session (?session=<id>) load with
    // an empty appliance_id — the server returns 404 and the activity pane
    // shows "Error: 404 page not found". Setting the value early (and firing
    // change) gives the framework's deep-link resume a valid appliance_id
    // before its retry-anyway fallback fires.
    function bootAppliancePicker(tries) {
      var sel = document.querySelector('.ui-agent-extras select');
      if (!sel) {
        if (tries < 30) setTimeout(function(){ bootAppliancePicker(tries + 1); }, 100);
        return;
      }
      if (sel.value) return; // already set (deep-link / session event) — don't override
      var saved = '';
      try { saved = localStorage.getItem('servitor_last_appliance') || ''; } catch (_) {}
      if (!saved) return;
      var exists = false;
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === saved) { exists = true; break; }
      }
      if (!exists) return; // stale id (deleted appliance / different user) — leave placeholder
      sel.value = saved;
      sel.dispatchEvent(new Event('change', {bubbles: true}));
    }
    bootAppliancePicker(0);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', register);
  } else { register(); }
})();
</script>
